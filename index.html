// ===== Apple-style design tokens =====
const BLUE = "#0071e3";          // Apple accent blue
const BLUE_DARK = "#0077ed";
const INK = "#1d1d1f";           // near-black text
const GREY = "#86868b";          // Apple secondary grey
const LINE = "#d2d2d7";          // hairline border
const BG = "#fbfbfd";            // Apple off-white page
const CARD = "#ffffff";
const GREEN = "#34c759";         // iOS green (correct)
const RED = "#ff3b30";           // iOS red (wrong)
const RADIUS = 18;

const STORE_KEY = "tcf_progress_v1";
const WORKER_KEY = "tcf_worker_url";

function saveProgress(d){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(d)); }catch(e){} }
function loadProgress(){ try{ const r=localStorage.getItem(STORE_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function getWorkerUrl(){ try{ return localStorage.getItem(WORKER_KEY)||""; }catch(e){ return ""; } }
function setWorkerUrl(u){ try{ localStorage.setItem(WORKER_KEY,u); }catch(e){} }

const emptyStats = { lifetimeCorrect:0, lifetimeAnswered:0, sessions:0, masteredIds:[], strugglingIds:[], bestPct:0 };
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

async function askClaude(system, messages, maxTokens){
  const url=getWorkerUrl(); if(!url) throw new Error("NO_WORKER");
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system,messages,max_tokens:maxTokens||1024})});
  const data=await r.json();
  if(!r.ok||data.error) throw new Error(data.error||"Erreur API");
  return data.text;
}

function Spinner(){ return <span className="spin">◠</span>; }

// Reusable Apple-style primary button (pill)
function PillButton({ onClick, children, kind="primary", disabled, style }){
  const base={ border:"none", borderRadius:980, padding:"12px 22px", fontSize:16, fontWeight:500, transition:"all .25s", letterSpacing:"-0.01em", ...style };
  const kinds={
    primary:{ background:disabled?"#a3a3a8":BLUE, color:"#fff" },
    secondary:{ background:"transparent", color:BLUE, border:"1px solid "+BLUE },
    grey:{ background:"#e8e8ed", color:INK },
    ghost:{ background:"transparent", color:BLUE, padding:"8px 4px" },
  };
  return <button onClick={onClick} disabled={disabled} style={{...base,...kinds[kind]}}>{children}</button>;
}

function App(){
  const ALL = [...QUESTIONS.map(q=>({...q,type:q.type||"grammar"})), ...READING.map(q=>({...q,type:"reading"}))].map((q,i)=>({...q,id:i}));
  const GRAMMAR_COUNT = QUESTIONS.length;
  const READING_COUNT = READING.length;
  const [questions,setQuestions]=useState([]);
  const [current,setCurrent]=useState(0);
  const [selected,setSelected]=useState(null);
  const [score,setScore]=useState(0);
  const [wrong,setWrong]=useState([]);
  const [phase,setPhase]=useState("home");
  const [mode,setMode]=useState("all");
  const [stats,setStats]=useState(emptyStats);
  const [hasSession,setHasSession]=useState(false);
  const [aiQuestion,setAiQuestion]=useState(null);
  const [aiLoading,setAiLoading]=useState(false);
  const [deepExpl,setDeepExpl]=useState("");
  const [deepLoading,setDeepLoading]=useState(false);
  const [workerUrlInput,setWorkerUrlInput]=useState(getWorkerUrl());
  const [showTutor,setShowTutor]=useState(false);
  const [showSettings,setShowSettings]=useState(false);
  const hasWorker=!!getWorkerUrl();

  useEffect(()=>{ const s=loadProgress(); if(s){ setStats(s.stats||emptyStats); if(s.session&&s.session.order&&s.session.current<s.session.order.length) setHasSession(true); } },[]);
  const persist=(ns,session)=>saveProgress({stats:ns,session:session||null});
  const resumeSession=()=>{ const s=loadProgress(); if(s&&s.session){ const x=s.session; setQuestions(x.order.map(id=>ALL[id])); setCurrent(x.current); setScore(x.score); setWrong(x.wrong||[]); setMode(x.mode||"all"); setSelected(null); setDeepExpl(""); setPhase("quiz"); } };
  const start=(m,cat="all")=>{ setMode(m); const base=cat==="all"?ALL:ALL.filter(x=>x.type===cat); const pool=m==="random20"?shuffle(base).slice(0,20):shuffle(base); setQuestions(pool); setCurrent(0); setSelected(null); setScore(0); setWrong([]); setDeepExpl(""); setAiQuestion(null); setPhase("quiz"); setHasSession(true); saveProgress({stats,session:{order:pool.map(q=>q.id),current:0,score:0,wrong:[],mode:m,cat}}); };

  const q=aiQuestion||questions[current];
  const total=questions.length;
  const progress=total>0?(current/total)*100:0;
  const isWrong=selected!==null&&q&&selected!==q.correct;

  function handleSelect(i){
    if(selected!==null) return;
    setSelected(i); setDeepExpl("");
    if(aiQuestion) return;
    const correct=i===q.correct;
    const newScore=correct?score+1:score;
    const newWrong=correct?wrong:[...wrong,{...q,chosen:i}];
    if(correct) setScore(newScore); else setWrong(newWrong);
    const mastered=new Set(stats.masteredIds),struggling=new Set(stats.strugglingIds);
    if(correct){ mastered.add(q.id); struggling.delete(q.id);} else { struggling.add(q.id); mastered.delete(q.id);} 
    const ns={...stats,lifetimeCorrect:stats.lifetimeCorrect+(correct?1:0),lifetimeAnswered:stats.lifetimeAnswered+1,masteredIds:[...mastered],strugglingIds:[...struggling]};
    setStats(ns); persist(ns,{order:questions.map(x=>x.id),current,score:newScore,wrong:newWrong,mode});
  }
  function next(){
    setAiQuestion(null); setDeepExpl("");
    if(current+1>=total){ const pct=Math.round((score/total)*100); const fs={...stats,sessions:stats.sessions+1,bestPct:Math.max(stats.bestPct,pct)}; setStats(fs); persist(fs,null); setHasSession(false); setPhase("result"); }
    else { const nc=current+1; setCurrent(nc); setSelected(null); persist(stats,{order:questions.map(x=>x.id),current:nc,score,wrong,mode}); }
  }
  async function generateAIQuestion(){
    setAiLoading(true); setSelected(null); setDeepExpl("");
    try{
      const txt=await askClaude("Tu es examinateur du TCF niveau B2. Génère UNE question de type « Structure de la langue » (phrase à trou, 4 options A/B/C/D). Réponds UNIQUEMENT en JSON brut sans markdown: {\"sentence\":\"phrase avec ___ pour le trou\",\"options\":[\"..\",\"..\",\"..\",\"..\"],\"correct\":0,\"rule\":\"règle en français\",\"why\":[\"pourquoi faux ou null\",\"..\",\"..\",\"..\"]}. null pour la bonne réponse.",[{role:"user",content:"Nouvelle question B2 variée."}],700);
      const obj=JSON.parse(txt.replace(/```json/g,"").replace(/```/g,"").trim());
      obj.id="ai"; setAiQuestion(obj); setSelected(null);
    }catch(e){ alert(e.message==="NO_WORKER"?"Configure d'abord ton serveur IA (Réglages).":"Erreur IA : "+e.message); }
    setAiLoading(false);
  }
  async function explainDeeper(){
    setDeepLoading(true);
    try{
      const ctx = q.type==="reading"
        ? `Texte : "${q.passage}"\nQuestion : "${q.question}"\nBonne réponse : "${q.options[q.correct]}"\nMa réponse : "${q.options[selected]}".\nExplique pourquoi la bonne réponse est correcte et pourquoi la mienne est fausse, en t\u2019appuyant sur le texte.`
        : `Phrase: "${q.sentence}"\nBonne réponse: "${q.options[q.correct]}"\nJ\u2019ai répondu: "${q.options[selected]}".\nExplique la règle, pourquoi c\u2019est faux, et donne un autre exemple.`;
      const txt=await askClaude("Tu es un professeur de français bienveillant (TCF B2). Explique clairement, en 4-6 phrases.",[{role:"user",content:ctx}],500);
      setDeepExpl(txt);
    }catch(e){ setDeepExpl(e.message==="NO_WORKER"?"Configure d'abord ton serveur IA (Réglages).":"Erreur : "+e.message); }
    setDeepLoading(false);
  }
  function renderSentence(s){
    const p=s.split("___");
    if(p.length===1) return <span>{s}</span>;
    return (<span>{p[0]}<span style={{display:"inline-block",borderBottom:"2px solid "+BLUE,minWidth:54,margin:"0 5px",color:selected!==null?BLUE:"transparent",fontWeight:600}}>{selected!==null?q.options[q.correct]:"\u00A0\u00A0\u00A0\u00A0\u00A0"}</span>{p[1]}</span>);
  }

  // ===== Tutor Chat =====
  function TutorChat({ onClose }){
    const [msgs,setMsgs]=useState([{role:"assistant",content:"Bonjour. Je suis votre tuteur de français. Posez-moi une question de grammaire, de vocabulaire, ou demandez une règle du TCF B2."}]);
    const [input,setInput]=useState(""); const [busy,setBusy]=useState(false); const sc=useRef(null);
    useEffect(()=>{ if(sc.current) sc.current.scrollTop=sc.current.scrollHeight; },[msgs,busy]);
    async function send(){
      if(!input.trim()||busy) return;
      const nm=[...msgs,{role:"user",content:input.trim()}]; setMsgs(nm); setInput(""); setBusy(true);
      try{ const txt=await askClaude("Tu es un tuteur de français patient et clair (objectif TCF B2). Réponds de façon concise et pédagogique avec des exemples. Français ou anglais selon l'élève.",nm.map(m=>({role:m.role,content:m.content})),700); setMsgs(m=>[...m,{role:"assistant",content:txt}]); }
      catch(e){ setMsgs(m=>[...m,{role:"assistant",content:e.message==="NO_WORKER"?"Configure d'abord ton serveur IA (Réglages).":"Erreur : "+e.message}]); }
      setBusy(false);
    }
    return (
      <div style={{position:"fixed",inset:0,background:BG,zIndex:50,display:"flex",flexDirection:"column",paddingTop:"env(safe-area-inset-top)"}}>
        <div style={{padding:"16px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"1px solid "+LINE,background:"rgba(255,255,255,0.8)",backdropFilter:"blur(20px)"}}>
          <div style={{fontWeight:600,fontSize:17,letterSpacing:"-0.02em"}}>Tuteur</div>
          <button onClick={onClose} style={{background:"none",border:"none",color:BLUE,fontSize:16}}>OK</button>
        </div>
        <div ref={sc} style={{flex:1,overflowY:"auto",padding:20,display:"flex",flexDirection:"column",gap:12}}>
          {msgs.map((m,i)=>(<div key={i} className="fade" style={{alignSelf:m.role==="user"?"flex-end":"flex-start",maxWidth:"82%",background:m.role==="user"?BLUE:CARD,color:m.role==="user"?"#fff":INK,borderRadius:20,padding:"12px 17px",fontSize:15,lineHeight:1.55,whiteSpace:"pre-wrap",boxShadow:m.role==="user"?"none":"0 1px 6px rgba(0,0,0,0.06)"}}>{m.content}</div>))}
          {busy&&<div style={{alignSelf:"flex-start",background:CARD,borderRadius:20,padding:"12px 17px",color:GREY}}><Spinner/></div>}
        </div>
        <div style={{padding:16,paddingBottom:"max(16px,env(safe-area-inset-bottom))",background:CARD,display:"flex",gap:10,borderTop:"1px solid "+LINE}}>
          <textarea value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}} placeholder="Message" rows={1} style={{flex:1,borderRadius:22,border:"1px solid "+LINE,padding:"11px 18px",fontSize:16,resize:"none",outline:"none",maxHeight:100,background:BG}}/>
          <button onClick={send} disabled={busy||!input.trim()} style={{borderRadius:"50%",width:42,height:42,border:"none",background:busy||!input.trim()?"#c7c7cc":BLUE,color:"#fff",fontSize:18,flexShrink:0,transition:"all .2s"}}>↑</button>
        </div>
      </div>
    );
  }

  // ===== Settings =====
  if(showSettings){
    return (
      <div style={{minHeight:"100vh",background:BG,padding:"max(24px,env(safe-area-inset-top)) 22px 40px"}}>
        <div style={{maxWidth:600,margin:"0 auto"}} className="fade">
          <button onClick={()=>setShowSettings(false)} style={{background:"none",border:"none",color:BLUE,fontSize:16,marginBottom:24,padding:0}}>‹ Retour</button>
          <h1 style={{fontSize:34,fontWeight:600,letterSpacing:"-0.03em",margin:"0 0 6px"}}>Réglages</h1>
          <p style={{color:GREY,fontSize:17,margin:"0 0 30px",letterSpacing:"-0.01em"}}>Connecte ton serveur IA pour activer le tuteur, les questions générées et les explications.</p>
          <div style={{background:CARD,borderRadius:RADIUS,padding:24,boxShadow:"0 2px 14px rgba(0,0,0,0.05)"}}>
            <label style={{fontSize:13,fontWeight:600,color:GREY,textTransform:"uppercase",letterSpacing:"0.04em"}}>Adresse du serveur</label>
            <input value={workerUrlInput} onChange={e=>setWorkerUrlInput(e.target.value)} placeholder="https://ton-worker.workers.dev" style={{width:"100%",borderRadius:12,border:"1px solid "+LINE,padding:"14px 16px",fontSize:16,outline:"none",boxSizing:"border-box",marginTop:10,background:BG}}/>
            <div style={{marginTop:18}}><PillButton onClick={()=>{ setWorkerUrl(workerUrlInput.trim()); alert("Serveur enregistré."); setShowSettings(false); }} style={{width:"100%"}}>Enregistrer</PillButton></div>
          </div>
          <p style={{fontSize:13,color:GREY,lineHeight:1.6,marginTop:20}}>Pas encore de serveur ? Les 40 questions et leurs explications fonctionnent déjà sans connexion. Demande à Claude les étapes pour créer un Cloudflare Worker gratuit.</p>
        </div>
      </div>
    );
  }
  if(showTutor) return <TutorChat onClose={()=>setShowTutor(false)} />;

  // ===== Home =====
  if(phase==="home"){
    const mastered=stats.masteredIds.length, struggling=stats.strugglingIds.length;
    const pct=stats.lifetimeAnswered>0?Math.round((stats.lifetimeCorrect/stats.lifetimeAnswered)*100):0;
    return (
      <div style={{minHeight:"100vh",background:BG}}>
        {/* Nav bar */}
        <div style={{position:"sticky",top:0,zIndex:10,background:"rgba(251,251,253,0.8)",backdropFilter:"blur(20px)",borderBottom:"1px solid "+LINE,padding:"calc(env(safe-area-inset-top) + 12px) 22px 12px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{fontSize:18,fontWeight:600,letterSpacing:"-0.02em"}}>TCF B2</span>
          <button onClick={()=>setShowSettings(true)} style={{background:"none",border:"none",color:BLUE,fontSize:15}}>Réglages</button>
        </div>

        <div style={{maxWidth:600,margin:"0 auto",padding:"0 22px 60px"}}>
          {/* Hero */}
          <div className="fade" style={{textAlign:"center",padding:"56px 0 44px"}}>
            <div style={{fontSize:15,color:BLUE,fontWeight:600,letterSpacing:"-0.01em",marginBottom:10}}>Entraînement TCF</div>
            <h1 style={{fontSize:46,lineHeight:1.05,fontWeight:600,letterSpacing:"-0.035em",margin:"0 0 16px"}}>Maîtrise ton<br/>français.</h1>
            <p style={{fontSize:19,color:GREY,letterSpacing:"-0.01em",margin:"0 0 30px",lineHeight:1.4}}>{ALL.length} questions niveau B2.{hasWorker?" Avec tuteur IA.":""}</p>
            <div style={{display:"flex",gap:14,justifyContent:"center",flexWrap:"wrap"}}>
              {hasSession
                ? <><PillButton onClick={resumeSession}>Reprendre</PillButton><PillButton kind="secondary" onClick={()=>start("all","all")}>Recommencer</PillButton></>
                : <><PillButton onClick={()=>start("all","all")}>Tout commencer</PillButton><PillButton kind="secondary" onClick={()=>start("random20","all")}>Mode rapide</PillButton></>}
            </div>
          </div>

          {/* Thèmes */}
          <div className="fade" style={{display:"flex",gap:14,marginBottom:18,flexWrap:"wrap"}}>
            <button onClick={()=>start("all","grammar")} style={{flex:"1 1 46%",minWidth:150,background:CARD,border:"1px solid "+LINE,borderRadius:18,padding:"20px 18px",textAlign:"left",boxShadow:"0 2px 14px rgba(0,0,0,0.05)"}}>
              <div style={{fontSize:17,fontWeight:600,letterSpacing:"-0.02em",color:INK,marginBottom:3}}>Structure de la langue</div>
              <div style={{fontSize:14,color:GREY}}>{GRAMMAR_COUNT} questions · phrases à trou</div>
            </button>
            <button onClick={()=>start("all","reading")} style={{flex:"1 1 46%",minWidth:150,background:CARD,border:"1px solid "+LINE,borderRadius:18,padding:"20px 18px",textAlign:"left",boxShadow:"0 2px 14px rgba(0,0,0,0.05)"}}>
              <div style={{fontSize:17,fontWeight:600,letterSpacing:"-0.02em",color:INK,marginBottom:3}}>Compréhension écrite</div>
              <div style={{fontSize:14,color:GREY}}>{READING_COUNT} questions · textes</div>
            </button>
          </div>

          {/* Stats card */}
          <div className="fade" style={{background:CARD,borderRadius:22,padding:"30px 28px",boxShadow:"0 2px 18px rgba(0,0,0,0.05)",marginBottom:18}}>
            <div style={{display:"flex",justifyContent:"space-around",textAlign:"center",marginBottom:24}}>
              {[{v:pct+"%",l:"Réussite"},{v:mastered,l:"Maîtrisées"},{v:struggling,l:"À revoir"}].map((s,i)=>(
                <div key={i}>
                  <div style={{fontSize:32,fontWeight:600,letterSpacing:"-0.03em"}}>{s.v}</div>
                  <div style={{fontSize:13,color:GREY,marginTop:2}}>{s.l}</div>
                </div>
              ))}
            </div>
            <div style={{height:6,background:"#e8e8ed",borderRadius:3,overflow:"hidden"}}><div style={{height:"100%",width:`${(mastered/ALL.length)*100}%`,background:BLUE,borderRadius:3,transition:"width .5s"}}/></div>
            <div style={{fontSize:13,color:GREY,marginTop:12,textAlign:"center"}}>{Math.round((mastered/ALL.length)*100)}% du programme maîtrisé{stats.sessions>0?` · Meilleur score ${stats.bestPct}%`:""}</div>
          </div>

          {/* AI section */}
          <div className="fade" style={{background:CARD,borderRadius:22,padding:"26px 28px",boxShadow:"0 2px 18px rgba(0,0,0,0.05)",marginBottom:18}}>
            <div style={{fontSize:21,fontWeight:600,letterSpacing:"-0.02em",marginBottom:4}}>Intelligence</div>
            <p style={{fontSize:15,color:GREY,margin:"0 0 18px",lineHeight:1.45}}>Un tuteur, des questions infinies, des explications sur mesure.</p>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <button onClick={()=>setShowTutor(true)} style={{width:"100%",padding:"15px 18px",borderRadius:14,border:"1px solid "+LINE,background:BG,fontSize:16,fontWeight:500,textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center",color:INK}}>Tuteur IA <span style={{color:BLUE}}>›</span></button>
              <button onClick={()=>{ start("ai"); setTimeout(generateAIQuestion,50); }} style={{width:"100%",padding:"15px 18px",borderRadius:14,border:"1px solid "+LINE,background:BG,fontSize:16,fontWeight:500,textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center",color:INK}}>Question générée par IA <span style={{color:BLUE}}>›</span></button>
            </div>
            {!hasWorker&&<div style={{fontSize:13,color:"#bf8700",marginTop:14,background:"#fff8e6",padding:"10px 14px",borderRadius:10}}>Active ces fonctions dans Réglages.</div>}
          </div>

          {struggling>0&&(
            <div className="fade" onClick={()=>{ const pool=shuffle(ALL.filter(qq=>stats.strugglingIds.includes(qq.id))); setMode("struggling"); setQuestions(pool); setCurrent(0); setSelected(null); setScore(0); setWrong([]); setPhase("quiz"); setHasSession(true); saveProgress({stats,session:{order:pool.map(qq=>qq.id),current:0,score:0,wrong:[],mode:"struggling"}}); }} style={{background:CARD,borderRadius:22,padding:"22px 28px",boxShadow:"0 2px 18px rgba(0,0,0,0.05)",marginBottom:18,display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
              <div><div style={{fontSize:17,fontWeight:600,letterSpacing:"-0.02em"}}>Réviser mes erreurs</div><div style={{fontSize:14,color:GREY,marginTop:2}}>{struggling} question{struggling>1?"s":""} à revoir</div></div>
              <span style={{color:BLUE,fontSize:22}}>›</span>
            </div>
          )}

          {(stats.lifetimeAnswered>0||hasSession)&&<div style={{textAlign:"center",marginTop:8}}><button onClick={()=>{ if(confirm("Réinitialiser toute ta progression ?")){ setStats(emptyStats); setHasSession(false); saveProgress({stats:emptyStats,session:null}); } }} style={{background:"none",border:"none",color:GREY,fontSize:14}}>Réinitialiser la progression</button></div>}
        </div>
      </div>
    );
  }

  // ===== Quiz =====
  if(phase==="quiz"&&q){
    const isAI=!!aiQuestion;
    return (
      <div style={{minHeight:"100vh",background:BG}}>
        <div style={{position:"sticky",top:0,zIndex:10,background:"rgba(251,251,253,0.8)",backdropFilter:"blur(20px)",borderBottom:"1px solid "+LINE,padding:"calc(env(safe-area-inset-top) + 12px) 22px 12px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",maxWidth:600,margin:"0 auto"}}>
            <button onClick={()=>{setAiQuestion(null);setPhase("home");}} style={{background:"none",border:"none",color:BLUE,fontSize:16,padding:0}}>‹ Accueil</button>
            <span style={{fontSize:15,color:GREY,fontWeight:500}}>{isAI?"Question IA":(current+1)+" sur "+total}</span>
            <button onClick={()=>setShowTutor(true)} style={{background:"none",border:"none",color:BLUE,fontSize:15}}>Tuteur</button>
          </div>
          {!isAI&&<div style={{maxWidth:600,margin:"10px auto 0",height:4,background:"#e8e8ed",borderRadius:2,overflow:"hidden"}}><div style={{height:"100%",width:`${progress}%`,background:BLUE,borderRadius:2,transition:"width .3s"}}/></div>}
        </div>

        <div style={{maxWidth:600,margin:"0 auto",padding:"36px 22px 60px"}}>
          <div className="fade" key={isAI?"ai":current} style={{marginBottom:30}}>
            <div style={{fontSize:13,color:BLUE,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:16,textAlign:"center"}}>{isAI?"Générée par IA":(q.type==="reading"?"Compréhension écrite":"Complétez")}</div>
            {q.type==="reading"
              ? <>
                  <div style={{background:CARD,border:"1px solid "+LINE,borderRadius:RADIUS,padding:"20px 22px",maxHeight:"42vh",overflowY:"auto",fontSize:16,lineHeight:1.7,color:"#33333a",letterSpacing:"-0.01em",whiteSpace:"pre-line",WebkitOverflowScrolling:"touch"}}>{q.passage}</div>
                  <div style={{fontSize:22,lineHeight:1.4,fontWeight:600,letterSpacing:"-0.02em",textAlign:"center",color:INK,marginTop:22}}>{q.question}</div>
                </>
              : <div style={{fontSize:26,lineHeight:1.45,fontWeight:500,letterSpacing:"-0.02em",textAlign:"center",color:INK}}>{renderSentence(q.sentence)}</div>}
          </div>

          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {q.options.map((opt,i)=>{
              let bg=CARD,border="1px solid "+LINE,color=INK,sh="0 1px 4px rgba(0,0,0,0.04)";
              if(selected!==null){
                if(i===q.correct){bg="#eafaef";border="1px solid "+GREEN;color="#0a7d33";}
                else if(i===selected){bg="#ffeceb";border="1px solid "+RED;color="#c4271f";}
                else {bg=CARD;color:GREY;}
              } else if(selected===i){border="1px solid "+BLUE;}
              return (<button key={i} onClick={()=>handleSelect(i)} style={{padding:"17px 20px",borderRadius:14,border,background:bg,color,fontSize:17,fontWeight:500,textAlign:"left",transition:"all .2s",display:"flex",alignItems:"center",gap:14,boxShadow:selected===null?sh:"none",letterSpacing:"-0.01em"}}>
                <span style={{width:26,height:26,borderRadius:"50%",border:selected!==null&&(i===q.correct||i===selected)?"none":"1.5px solid "+LINE,background:selected!==null&&i===q.correct?GREEN:selected!==null&&i===selected?RED:"transparent",color:selected!==null&&(i===q.correct||i===selected)?"#fff":GREY,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:600,flexShrink:0}}>{selected!==null&&i===q.correct?"✓":selected!==null&&i===selected?"✕":["A","B","C","D"][i]}</span>
                {opt}
              </button>);
            })}
          </div>

          {selected!==null&&(
            <div className="fade" style={{marginTop:24,background:CARD,borderRadius:RADIUS,padding:24,boxShadow:"0 2px 14px rgba(0,0,0,0.05)"}}>
              <div style={{fontSize:13,fontWeight:600,color:isWrong?RED:GREEN,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.04em"}}>{isWrong?"À retenir":"Correct"}</div>
              <div style={{fontSize:16,lineHeight:1.6,color:INK,marginBottom:isWrong?16:0,letterSpacing:"-0.01em"}}><strong style={{fontWeight:600}}>« {q.options[q.correct]} »</strong> — {q.rule}</div>
              {isWrong&&q.why&&(<div style={{display:"flex",flexDirection:"column",gap:9,borderTop:"1px solid "+LINE,paddingTop:16}}>{q.options.map((opt,i)=>{ if(i===q.correct||!q.why[i]) return null; return (<div key={i} style={{fontSize:14.5,lineHeight:1.55,color:"#515154"}}><span style={{color:RED,fontWeight:600}}>{opt}</span> — {q.why[i]}</div>); })}</div>)}
              {isWrong&&(<div style={{marginTop:16}}>
                {!deepExpl&&<PillButton kind="secondary" onClick={explainDeeper} disabled={deepLoading} style={{fontSize:14,padding:"10px 18px"}}>{deepLoading?<><Spinner/> Analyse…</>:"Explique-moi plus"}</PillButton>}
                {deepExpl&&<div className="fade" style={{marginTop:6,background:BG,borderRadius:12,padding:16,fontSize:15,lineHeight:1.6,color:INK,whiteSpace:"pre-wrap"}}>{deepExpl}</div>}
              </div>)}
            </div>
          )}

          {selected!==null&&(
            <div style={{marginTop:24,textAlign:"center"}}>
              {isAI
                ? <PillButton onClick={()=>{ setAiQuestion(null); setSelected(null); setPhase("home"); }} style={{minWidth:200}}>Terminer</PillButton>
                : <PillButton onClick={next} style={{minWidth:200}}>{current+1>=total?"Voir le résultat":"Continuer"}</PillButton>}
              {isAI&&<div style={{marginTop:14}}><button onClick={generateAIQuestion} disabled={aiLoading} style={{background:"none",border:"none",color:BLUE,fontSize:15}}>{aiLoading?<Spinner/>:"Une autre question IA"}</button></div>}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ===== Result =====
  if(phase==="result"){
    const pct=Math.round((score/total)*100);
    const title=pct>=80?"Excellent.":pct>=60?"Bien joué.":"Continue.";
    const sub=pct>=80?"Tu es sur la bonne voie pour le B2.":pct>=60?"Encore un peu d'entraînement.":"La régularité paie. On y retourne ?";
    return (
      <div style={{minHeight:"100vh",background:BG,display:"flex",alignItems:"center",justifyContent:"center",padding:"max(24px,env(safe-area-inset-top)) 22px"}}>
        <div className="fade" style={{maxWidth:480,width:"100%",textAlign:"center"}}>
          <div style={{fontSize:13,color:BLUE,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:16}}>Résultat</div>
          <div style={{fontSize:80,fontWeight:600,letterSpacing:"-0.04em",lineHeight:1}}>{pct}%</div>
          <div style={{fontSize:17,color:GREY,margin:"8px 0 28px"}}>{score} bonnes réponses sur {total}</div>
          <h2 style={{fontSize:32,fontWeight:600,letterSpacing:"-0.03em",margin:"0 0 8px"}}>{title}</h2>
          <p style={{fontSize:18,color:GREY,margin:"0 0 32px",letterSpacing:"-0.01em"}}>{sub}</p>
          <div style={{display:"flex",flexDirection:"column",gap:12,alignItems:"center"}}>
            <PillButton onClick={()=>start("all")} style={{minWidth:240}}>Recommencer</PillButton>
            {wrong.length>0&&<PillButton kind="secondary" onClick={()=>setPhase("review")} style={{minWidth:240}}>Revoir mes {wrong.length} erreur{wrong.length>1?"s":""}</PillButton>}
            <button onClick={()=>setShowTutor(true)} style={{background:"none",border:"none",color:BLUE,fontSize:16,marginTop:4}}>Réviser avec le tuteur</button>
            <button onClick={()=>setPhase("home")} style={{background:"none",border:"none",color:GREY,fontSize:15}}>Accueil</button>
          </div>
        </div>
      </div>
    );
  }

  // ===== Review =====
  if(phase==="review"){
    return (
      <div style={{minHeight:"100vh",background:BG,padding:"max(24px,env(safe-area-inset-top)) 22px 60px"}}>
        <div style={{maxWidth:600,margin:"0 auto"}}>
          <button onClick={()=>setPhase("result")} style={{background:"none",border:"none",color:BLUE,fontSize:16,marginBottom:20,padding:0}}>‹ Retour</button>
          <h1 style={{fontSize:34,fontWeight:600,letterSpacing:"-0.03em",margin:"0 0 24px"}}>Mes erreurs</h1>
          {wrong.map((w,idx)=>(<div key={idx} className="fade" style={{background:CARD,borderRadius:RADIUS,padding:24,marginBottom:16,boxShadow:"0 2px 14px rgba(0,0,0,0.05)"}}>
            <div style={{fontSize:17,lineHeight:1.5,marginBottom:14,color:INK,fontWeight:500,letterSpacing:"-0.01em"}}>{w.type==="reading"?w.question:w.sentence.replace("___","« "+w.options[w.correct]+" »")}</div>
            <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:14}}>
              <span style={{fontSize:13,background:"#ffeceb",color:"#c4271f",borderRadius:8,padding:"5px 12px",fontWeight:500}}>Ta réponse : {w.options[w.chosen]}</span>
              <span style={{fontSize:13,background:"#eafaef",color:"#0a7d33",borderRadius:8,padding:"5px 12px",fontWeight:500}}>Correct : {w.options[w.correct]}</span>
            </div>
            <div style={{fontSize:15,lineHeight:1.6,color:"#515154",background:BG,borderRadius:12,padding:16}}>{w.rule}</div>
          </div>))}
          <div style={{textAlign:"center",marginTop:24}}><PillButton onClick={()=>start("all")} style={{minWidth:220}}>Recommencer</PillButton></div>
        </div>
      </div>
    );
  }
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
