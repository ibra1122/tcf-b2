<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

const QUESTIONS = [
  { sentence: "Je suis française mais j'habite ___ Canada depuis 14 ans.", options: ["à", "au", "du", "en"], correct: 1,
    rule: "Devant un nom de pays masculin (le Canada), on utilise « au » (à + le). On dit « au Canada », « au Japon », « au Maroc ».",
    why: ["« à » s'emploie devant les villes (à Paris), pas les pays masculins.", null, "« du » exprime la provenance (je viens du Canada), pas le lieu où l'on habite.", "« en » s'emploie devant les pays féminins (en France) ou masculins commençant par une voyelle (en Iran)."] },
  { sentence: "Pratiquez votre français ___ nos collections d'exercices interactifs !", options: ["avec", "de", "par", "sur"], correct: 0,
    rule: "« avec » indique le moyen/l'outil utilisé pour faire quelque chose. On pratique « avec » des exercices.",
    why: [null, "« de » n'exprime pas le moyen ici.", "« par » indique plutôt l'agent ou le passage, pas l'outil.", "« sur » indique une position ou un sujet, pas le moyen."] },
  { sentence: "Je n'ai pas encore téléphoné à Anne mais je ___ appellerai ce soir.", options: ["l'", "la", "les", "lui"], correct: 0,
    rule: "« appeler quelqu'un » est un verbe transitif direct : le COD remplace « Anne » par « la », qui s'élide en « l' » devant une voyelle (l'appellerai).",
    why: [null, "« la » est correct sur le fond mais doit s'élider en « l' » devant le « a » de appellerai.", "« les » est pluriel ; on parle d'une seule personne (Anne).", "« lui » est un COI, employé avec « téléphoner à » mais pas avec « appeler » qui est direct."] },
  { sentence: "Il fait très chaud à l'intérieur et il est malheureusement ___ d'ouvrir la fenêtre.", options: ["grave", "sévère", "dangereux", "sérieux"], correct: 2,
    rule: "« dangereux » exprime un risque/péril. Ouvrir la fenêtre présente un danger, d'où « il est dangereux de ».",
    why: ["« grave » qualifie une situation sérieuse mais pas un risque physique d'action.", "« sévère » se dit d'une personne stricte ou d'une punition.", null, "« sérieux » signifie important/réfléchi, pas risqué."] },
  { sentence: "Tu veux que je ___ les courses avant de rentrer ?", options: ["fais", "faisais", "fasse", "ferai"], correct: 2,
    rule: "Après « vouloir que », on emploie le SUBJONCTIF. « fasse » est le subjonctif présent de faire.",
    why: ["« fais » est l'indicatif présent ; interdit après vouloir que.", "« faisais » est l'imparfait de l'indicatif.", null, "« ferai » est le futur de l'indicatif."] },
  { sentence: "La direction ne saurait être tenue pour ___ en cas de vol.", options: ["auteur", "cadre", "garant", "responsable"], correct: 3,
    rule: "L'expression figée « être tenu pour responsable » signifie « être considéré comme responsable ». C'est une collocation fixe.",
    why: ["« auteur » désigne celui qui fait l'acte, pas la responsabilité juridique dans cette tournure.", "« cadre » est un poste ou un contexte.", "« garant » se construit avec « se porter garant », pas « tenu pour garant » dans ce sens.", null] },
  { sentence: "___ David Mermet, son entraîneur, la championne a réussi avec brio ce pari fou de traverser l'Atlantique à la rame.", options: ["À cause de", "À travers", "En raison de", "Grâce à"], correct: 3,
    rule: "« Grâce à » introduit une cause POSITIVE (un succès). Ici l'entraîneur a aidé à la réussite.",
    why: ["« À cause de » introduit une cause NÉGATIVE (un problème).", "« À travers » signifie en traversant, pas une cause.", "« En raison de » est neutre/administratif, mais ne souligne pas l'aide bénéfique.", null] },
  { sentence: "L'âge de la pierre taillée ___ de 2 millions à 10 000 ans avant J.-C.", options: ["dure", "s'écoule", "s'étend", "survit"], correct: 2,
    rule: "« s'étendre de... à... » exprime une période entre deux bornes temporelles. Idéal pour une époque historique.",
    why: ["« dure » exprime une durée mais ne se construit pas avec « de... à... » de cette façon.", "« s'écoule » se dit du temps qui passe, pas d'une période bornée.", null, "« survit » signifie continuer d'exister malgré tout."] },
  { sentence: "Notre émission vous propose de dresser le portrait ___ du nouveau chef du gouvernement.", options: ["automate", "machine", "mécanique", "robot"], correct: 3,
    rule: "« robot » est ici le mot juste pour « portrait-robot » — une expression figée désignant un portrait reconstitué.",
    why: ["« automate » désigne une machine autonome, pas ce type de portrait.", "« machine » ne forme pas d'expression avec portrait.", "« mécanique » est un adjectif/nom sans rapport ici.", null] },
  { sentence: "Quelle catastrophe ! En entendant la nouvelle j'ai été ___.", options: ["enterré", "harassé", "ratissé", "terrassé"], correct: 3,
    rule: "« terrassé » signifie abattu, accablé par une émotion violente. Sens figuré adapté à une mauvaise nouvelle.",
    why: ["« enterré » signifie mis en terre (littéral) ou oublié.", "« harassé » signifie épuisé par la fatigue, pas par un choc émotionnel.", "« ratissé » signifie fouillé/nettoyé, sans rapport.", null] },
  { sentence: "Antoine va ___ Liban pour les vacances.", options: ["à", "au", "du", "en"], correct: 1,
    rule: "« le Liban » est masculin → « au Liban » (à + le). Pour aller dans un pays masculin : au.",
    why: ["« à » s'emploie pour les villes.", null, "« du » exprime la provenance.", "« en » s'emploie pour les pays féminins."] },
  { sentence: "Je te laisse, je dois aller à la poste, je veux ___ un colis en Espagne.", options: ["donner", "envoyer", "recevoir", "rendre"], correct: 1,
    rule: "On va à la poste pour EXPÉDIER quelque chose : « envoyer un colis » est la collocation logique.",
    why: ["« donner » se fait en main propre, pas à la poste pour l'étranger.", null, "« recevoir » est l'inverse — on ne va pas à la poste pour recevoir activement.", "« rendre » signifie restituer, ce qui ne colle pas avec « en Espagne »."] },
  { sentence: "Camille ? Je la connais ___ dix ans.", options: ["dans", "de", "depuis", "il y a"], correct: 2,
    rule: "« depuis » indique le point de départ d'une action qui CONTINUE jusqu'à présent. Je la connais depuis dix ans (et encore aujourd'hui).",
    why: ["« dans » indique un moment futur (dans dix ans = plus tard).", "« de » n'exprime pas la durée ici.", null, "« il y a » situe un événement ponctuel dans le passé (je l'ai rencontrée il y a dix ans), pas une continuité."] },
  { sentence: "Félix habite au 16e étage de la ___ située près du bureau de poste.", options: ["chambre", "cité", "maison", "tour"], correct: 3,
    rule: "Un 16e étage implique un immeuble très haut : seule une « tour » a autant d'étages.",
    why: ["« chambre » est une pièce, pas un bâtiment à étages.", "« cité » est un ensemble de bâtiments, pas un seul avec 16 étages.", "« maison » n'a pas 16 étages.", null] },
  { sentence: "Je suis ___ par tous les transports que je prends pour aller au travail. Quand j'arrive chez moi, j'ai juste assez d'énergie pour me coucher.", options: ["déçue", "fatiguée", "distraite", "suprise"], correct: 1,
    rule: "Le contexte (manque d'énergie, envie de se coucher) indique l'épuisement : « fatiguée ».",
    why: ["« déçue » exprime une déception, pas un manque d'énergie.", null, "« distraite » signifie inattentive.", "« surprise » exprime l'étonnement (et le mot est mal orthographié)."] },
  { sentence: "J'ai demandé aux collègues quelle date conviendrait le mieux pour la réunion de service mais ___ que je propose, ils ne sont jamais satisfaits.", options: ["où", "quel", "qui", "quoi"], correct: 3,
    rule: "« quoi que » (en deux mots) signifie « peu importe ce que ». Ici : peu importe ce que je propose. Suivi du subjonctif (propose).",
    why: ["« où » concerne le lieu.", "« quel » s'accorde et précède un nom (quelle date), pas un verbe seul.", "« qui » concerne une personne.", null] },
  { sentence: "Ne t'inquiète pas, je te téléphonerai dès que l'avion ___.", options: ["atterrirait", "atterrisse", "aura atterri", "avait atterri"], correct: 2,
    rule: "Après « dès que » avec une principale au futur, on emploie le FUTUR ANTÉRIEUR pour une action achevée avant l'autre : « aura atterri » (l'atterrissage précède le coup de fil).",
    why: ["« atterrirait » est un conditionnel, incompatible ici.", "« atterrisse » est un subjonctif ; on n'emploie pas le subjonctif après « dès que ».", null, "« avait atterri » est un plus-que-parfait, qui situe l'action dans le passé."] },
  { sentence: "On ne regardera pas la 6e chaîne ce soir ! Je déteste les émissions de télé-réalité ! ___ je veux bien voir le film documentaire sur la 2e.", options: ["En effet,", "En revanche,", "Néanmoins,", "Or,"], correct: 1,
    rule: "« En revanche » marque une OPPOSITION/contraste entre deux préférences (je déteste ceci ↔ par contre j'aime cela).",
    why: ["« En effet » confirme/explique, n'oppose pas.", null, "« Néanmoins » exprime une concession (malgré tout), moins adapté qu'un simple contraste de goûts.", "« Or » introduit un argument nouveau dans un raisonnement, pas un contraste de goûts."] },
  { sentence: "Si ma sœur ne ___ pas systématiquement à la légère, elle n'aurait pas tant de défis à relever.", options: ["s'engage", "s'engageait", "s'est engagée", "s'était engagée"], correct: 1,
    rule: "Hypothèse irréelle du présent : « Si » + IMPARFAIT, principale au conditionnel présent (n'aurait pas). Donc « s'engageait ».",
    why: ["« s'engage » est le présent ; la concordance avec « aurait » exige l'imparfait.", null, "« s'est engagée » est un passé composé.", "« s'était engagée » (plus-que-parfait) irait avec un conditionnel passé (n'aurait pas eu)."] },
  { sentence: "Je suis inquiète de l'___ qu'a Jason pour ce groupe, ça tient du fanatisme.", options: ["accaparement", "admiration", "extase", "inspiration"], correct: 1,
    rule: "« admiration » (un attachement intense qui frôle le fanatisme) convient au sens. On admire un groupe.",
    why: ["« accaparement » signifie monopoliser, sans rapport.", null, "« extase » est un ravissement ponctuel, trop fort et mal construit ici.", "« inspiration » est ce qui pousse à créer, pas l'attachement décrit."] },
  { sentence: "À la montagne, en hiver, il ___ toujours très froid.", options: ["est", "fait", "sent", "va"], correct: 1,
    rule: "Pour la météo, on utilise « il fait » : il fait froid, il fait chaud, il fait beau.",
    why: ["« est » ne s'emploie pas pour la température ambiante (on ne dit pas « il est froid »).", null, "« sent » concerne l'odeur ou le toucher.", "« va » s'emploie pour la santé (il va bien)."] },
  { sentence: "Quand j'étais étudiant, je travaillais comme serveur pour ___ mes études.", options: ["acheter", "gagner", "offrir", "payer"], correct: 3,
    rule: "On « paie ses études » : régler le coût des études. Collocation naturelle.",
    why: ["« acheter » ne se dit pas avec « études ».", "« gagner » se dit pour de l'argent (gagner sa vie), pas « gagner ses études ».", "« offrir » signifie donner gratuitement.", null] },
  { sentence: "J'adore le cinéma ___ je n'y vais pas souvent parce que j'ai trop de travail.", options: ["alors", "donc", "et", "mais"], correct: 3,
    rule: "« mais » marque l'OPPOSITION entre aimer le cinéma et ne pas y aller. Contraste logique.",
    why: ["« alors » exprime une conséquence.", "« donc » exprime aussi une conséquence logique.", "« et » ajoute sans opposer.", null] },
  { sentence: "L'émission musicale ___ ce journaliste anime sur TV5 est vraiment passionnante.", options: ["dont", "où", "que", "qui"], correct: 2,
    rule: "« que » est pronom relatif COD : « ce journaliste anime [l'émission] » → l'émission QUE ce journaliste anime.",
    why: ["« dont » remplace un complément introduit par « de ».", "« où » indique le lieu ou le temps.", null, "« qui » est sujet (qui anime), mais ici le sujet est « ce journaliste »."] },
  { sentence: "Les candidats à l'élection présidentielle ont multiplié les ___ à la presse pour séduire les électeurs.", options: ["déclarations", "justifications", "intentions", "informations"], correct: 0,
    rule: "« faire des déclarations à la presse » est la collocation usuelle pour s'exprimer publiquement.",
    why: [null, "« justifications » suppose une accusation préalable.", "« intentions » ne se « multiplient » pas auprès de la presse.", "« informations » seraient données par la presse, non aux candidats."] },
  { sentence: "Les professeurs Watson, Crick et Wilkins ont reçu en 1962 le prix Nobel... à qui ils la ___ quand elle travaillait dans leur laboratoire.", options: ["dérobaient", "dérobent", "dérobèrent", "déroberont"], correct: 2,
    rule: "Récit historique daté (1962) → PASSÉ SIMPLE pour une action ponctuelle achevée : « dérobèrent ».",
    why: ["« dérobaient » (imparfait) exprime une action répétée/en cours, pas l'acte ponctuel.", "« dérobent » est le présent.", null, "« déroberont » est le futur."] },
  { sentence: "La commission a précisé que les financements culturels européens ___ des artistes sont liés à leurs compétences...", options: ["au fond", "au lieu", "au moyen", "au profit"], correct: 3,
    rule: "« au profit de » signifie « au bénéfice de ». Les financements sont accordés au profit (au bénéfice) des artistes.",
    why: ["« au fond » signifie en réalité/au final.", "« au lieu (de) » signifie à la place de.", "« au moyen (de) » signifie grâce à un outil.", null] },
  { sentence: "...l'actualité des prochains jours sera ___ orientée autour de sujets politiques.", options: ["cependant", "certes", "pourtant", "davantage"], correct: 3,
    rule: "« davantage » signifie « plus, dans une plus grande mesure ». L'actualité sera davantage (plus) orientée vers la politique.",
    why: ["« cependant » exprime une opposition.", "« certes » concède un point.", "« pourtant » marque une contradiction.", null] },
  { sentence: "Malgré l'invitation et le plan que je lui avais envoyés, Jacques n'a pas ___ se déplacer pour la cérémonie.", options: ["agréé", "concédé", "daigné", "toléré"], correct: 2,
    rule: "« daigner » = condescendre à faire quelque chose. « n'a pas daigné se déplacer » = il n'a même pas pris la peine de venir.",
    why: ["« agréé » signifie accepter/approuver, et ne se construit pas ainsi.", "« concédé » signifie admettre/céder.", null, "« toléré » signifie supporter, sens incompatible ici."] },
  { sentence: "...les mesures du gouvernement en faveur de la parité au travail ___ l'intégralité des milieux socio-professionnels.", options: ["élargissent", "étendent", "recouvrent", "remplissent"], correct: 2,
    rule: "« recouvrir » au sens figuré = couvrir, englober la totalité d'un domaine. Les mesures recouvrent (englobent) tous les milieux.",
    why: ["« élargissent » signifie rendre plus large (on élargit une mesure, pas un milieu).", "« étendent » a besoin d'un complément de destination (étendre à).", null, "« remplissent » se dit d'un contenant, sens concret inadapté."] },
  { sentence: "Je m'appelle Gian. Et toi, ___ tu t'appelles ?", options: ["comment", "pourquoi", "quand", "qui"], correct: 0,
    rule: "Pour demander un nom, on emploie « comment » : Comment tu t'appelles ? (= quel est ton nom).",
    why: [null, "« pourquoi » demande une raison.", "« quand » demande un moment.", "« qui » demande l'identité d'une personne mais ne se construit pas avec « s'appeler » de cette façon."] },
  { sentence: "Attention ! La séance de 18 heures pour le film « Folie douce » est ___. Il reste des places pour la séance de 20 heures.", options: ["complète.", "entière.", "nombreuse", "totale."], correct: 0,
    rule: "Une séance « complète » = toutes les places sont vendues (plus de place disponible). Sens attendu vu le contexte.",
    why: [null, "« entière » signifie non divisée, pas « pleine ».", "« nombreuse » qualifie une quantité de gens, pas une séance.", "« totale » signifie absolue, ne se dit pas d'une séance pleine."] },
  { sentence: "Avec le programme « Jeunes d'Europe », finissez ___ études à l'étranger.", options: ["leurs", "mes", "ses", "vos"], correct: 3,
    rule: "L'impératif « finissez » est à la 2e personne du pluriel (vous) → l'adjectif possessif correspondant est « vos ».",
    why: ["« leurs » renvoie à « ils/elles ».", "« mes » renvoie à « je ».", "« ses » renvoie à « il/elle ».", null] },
  { sentence: "Venez profiter des promotions ! Cette semaine, trois paquets de café ___ le prix de deux !", options: ["avec", "par", "pour", "selon"], correct: 2,
    rule: "« pour » exprime l'échange/le prix : trois paquets POUR le prix de deux (on obtient 3 en payant 2).",
    why: ["« avec » indique l'accompagnement.", "« par » indique le moyen ou la répartition.", null, "« selon » indique la conformité."] },
  { sentence: "Salut Léa ! ...J'attends les résultats de mon examen demain et je me sens vraiment ___. J'ai besoin de sortir un peu !", options: ["surprise", "déçue", "désolée", "nerveuse"], correct: 3,
    rule: "Attendre des résultats provoque de l'anxiété : « nerveuse » (tendue, stressée) est l'émotion logique.",
    why: ["« surprise » suppose un événement inattendu déjà arrivé.", "« déçue » suppose un résultat déjà connu et négatif.", "« désolée » exprime le regret.", null] },
  { sentence: "Cet après-midi, aussitôt après les déclarations de la direction à la presse, le syndicat ___ son plan d'action que les employés attendent avec impatience.", options: ["annonçait", "annonce", "annoncera", "annoncerait"], correct: 2,
    rule: "L'action est à venir (cet après-midi, attendue avec impatience) → FUTUR simple : « annoncera ».",
    why: ["« annonçait » est un imparfait (passé).", "« annonce » (présent) ne rend pas l'idée d'une action attendue plus tard.", null, "« annoncerait » est un conditionnel (incertitude/hypothèse)."] },
  { sentence: "Une fois votre document sélectionné, vous pouvez ___ la clé USB sur le port prévu à cet effet afin d'enregistrer votre document.", options: ["allumer", "cliquer", "insérer", "taper"], correct: 2,
    rule: "On « insère » une clé USB dans un port : introduire physiquement l'objet. Collocation technique correcte.",
    why: ["« allumer » se dit d'un appareil, pas d'une clé qu'on branche.", "« cliquer » se fait avec une souris.", null, "« taper » se dit au clavier."] },
  { sentence: "Nous continuons à marcher 2 h chaque jour ___ nous sommes âgés maintenant.", options: ["afin que", "bien que", "même si", "quoique"], correct: 2,
    rule: "« même si » + INDICATIF (nous sommes) exprime la concession. Ici l'indicatif « sommes » impose « même si » plutôt que les conjonctions à subjonctif.",
    why: ["« afin que » exprime le but + subjonctif.", "« bien que » exige le subjonctif (bien que nous soyons).", null, "« quoique » exige aussi le subjonctif (quoique nous soyons)."] },
  { sentence: "...Les boutiques accueillent une clientèle ___ de plus en plus nombreuse.", options: ["analogue", "disparate", "dissemblable", "homogène"], correct: 1,
    rule: "Le texte dit que TOUTES les catégories sociales sont concernées → une clientèle « disparate » (variée, hétérogène). Le sens du texte appelle la diversité.",
    why: ["« analogue » signifie semblable.", null, "« dissemblable » s'emploie pour comparer deux choses, pas pour qualifier une variété.", "« homogène » signifie uniforme — le contraire du sens voulu."] },
  { sentence: "Le nouveau président du parti demande à ses alliés de mettre en ___ les querelles intestines, afin de créer une unité nouvelle et mettre fin aux rivalités internes.", options: ["abyme", "exergue", "garde", "sourdine"], correct: 3,
    rule: "« mettre en sourdine » = atténuer, faire taire. Il veut faire taire les querelles. Expression figée.",
    why: ["« mettre en abyme » = représenter une œuvre dans l'œuvre.", "« mettre en exergue » = mettre en valeur (le contraire du sens voulu).", "« mettre en garde » = avertir d'un danger.", null] },  { sentence: "Chers voisins, je fais une petite fête samedi soir, vous pouvez ___ chez moi pour boire un verre. Alfonso, votre voisin du 1er, porte 25.", options: ["aller", "partir", "sortir", "venir"], correct: 3, rule: "« venir chez quelqu'un » exprime le mouvement vers le lieu où se trouve la personne qui parle (l'hôte invite chez lui).", why: ["« aller » s'éloigne du locuteur, pas vers lui.", "« partir » signifie quitter un lieu.", "« sortir » signifie aller dehors.", null] },

  { passage: "L'accès à l'université est libre pour tout diplômé de l'enseignement secondaire. Les candidats devront effectuer sur le site du ministère au maximum 12 vœux de licences. Pour la plupart d'entre elles, en particulier en dehors de Paris, il n'y a aucune sélection. En région parisienne, le nombre de candidats étant supérieur aux places offertes, vous devrez faire 6 vœux. « Si vous ne faites pas six vœux, un algorithme fera passer votre candidature automatiquement après les autres », prévient Bernard Koehret, responsable du programme d'admission postbac.", question: "Dans cet article, quel conseil est donné aux jeunes qui veulent faire des études à Paris ?", options: ["Bien respecter les délais d'inscription à l'université.","S'inscrire dans plus d'universités qu'il est demandé.","Respecter rigoureusement les procédures d'inscription.","S'inscrire dans une université dans une autre région."], correct: 2,

  { passage: "La tradition daterait de la Renaissance et aurait été initiée par le roi Charles IX, qui, séduit par les jolies clochettes du muguet, en aurait offert quelques brins en guise de porte-bonheur à toutes les dames de la cour, la veille de son sacre, le 1er mai. Depuis, la fleur, synonyme de renouveau, se cueille par brassées en ce jour, toujours pour porter chance à celui qui la reçoit. Cette année, elle a aussi été choisie par la maison Fragonard, qui lui a dédié toute une ligne éphémère d'objets.", question: "Qu'apprend-on sur la tradition du muguet ?", options: ["Elle a changé de signification avec le temps.","Elle est plus populaire de nos jours qu'avant.","Elle a été remplacée par une autre coutume.","Elle trouve son origine dans l'Histoire de France."], correct: 3,

    why: ["La fleur reste un porte-bonheur ; sa signification n'a pas changé.","Le texte ne compare pas sa popularité d'hier et d'aujourd'hui.","La coutume perdure, elle n'a pas été remplacée.",null] },
  { passage: "Les trois quarts des Français sondés pour le journal L'Expansion sont d'accord : nos grandes marques de luxe sont les meilleurs ambassadeurs de la France à l'étranger. Mais nos belles griffes sont surtout la meilleure réponse à la délocalisation massive de nos emplois industriels. Quand les marques de chaussettes ou de jouets achètent pour quelques centimes des modèles fabriqués à l'étranger, nos maisons de luxe engrangent des milliers d'euros de marge sur les bijoux, parfums et sacs produits par des artisans français. « C'est de la délocalisation à l'envers », aime à résumer Bernard Arnault, le PDG du Groupe LVMH.", question: "Quel message principal fait passer le journaliste ?", options: ["Le luxe est l'industrie française la plus rentable de toutes.","Le luxe est la meilleure des industries françaises.","L'industrie du luxe fait d'abord travailler des Français.","Le luxe représente le vrai savoir-faire à la française."], correct: 2,

    why: ["La rentabilité n'est pas comparée à toutes les industries.","Le texte ne classe pas le luxe « meilleure » industrie en soi.",null,"Le savoir-faire est sous-entendu, mais le message central est l'emploi en France."] },
  { passage: "À tous nos abonnés. En raison d'une grève touchant l'ensemble des quotidiens nationaux, vous n'avez pas reçu votre journal aujourd'hui et nous en sommes sincèrement désolés. Pour vous permettre de rester à la pointe de l'information, nous vous ouvrons gratuitement pendant cette journée du 15 avril l'accès à l'intégralité du journal en ligne.", question: "Quel est l'objectif de ce message ?", options: ["Prévenir de la suppression de l'abonnement.","Expliquer l'envoi du mauvais magazine.","Informer des problèmes de livraison.","S'excuser du délai tardif de la réponse."], correct: 2,
    rule: "À cause d'une grève, le journal n'a pas été livré : le message informe d'un problème de livraison et propose une solution en ligne.",
    why: ["L'abonnement n'est pas supprimé.","Ce n'est pas un mauvais envoi mais une absence de livraison.",null,"Il ne s'agit pas d'un retard de réponse mais d'un journal non distribué."] },
  { passage: "Partir à la découverte… d'Amsterdam. Balade au fil de l'eau. Nombreuses sont les villes comparées à Venise à travers le monde. Mais une en particulier surnage parmi les autres : Amsterdam. Nichée sur les rives du fleuve Amstel, dont elle tire en partie son nom, celle qu'on appelle la « Venise du Nord » charme tous ses visiteurs. Ses canaux dans lesquels se mirent de beaux immeubles aux façades élancées – environ 7 000 maisons sont classées monuments historiques – et son centre-ville quasi hermétique à la circulation automobile en font un paradis pour les marcheurs et les cyclistes. Et cela tombe bien, car la ville n'est pas très étendue et se laisse parcourir facilement.", question: "Quel aspect de la ville d'Amsterdam est mis en valeur ?", options: ["La balade piétonne.","La petitesse des maisons.","L'état des canaux.","Les dangers de la circulation à vélo."], correct: 0,

    why: [null,"On parle de façades élancées, pas de petites maisons.","Les canaux sont admirés, leur « état » n'est pas le sujet.","Le vélo y est agréable, pas dangereux."] },
  { passage: "Premier Shakespeare de la saison, un « Othello » gadget. On commencera donc avec cet Othello que l'on se dépêchera d'oublier : le spectacle est d'une indigence rare. L'équipe semble avoir comme à plaisir multiplié des contre-pieds stériles.", question: "Cette appréciation sur la pièce de théâtre est :", options: ["Franchement négative.","Franchement positive.","Neutre.","Mitigée."], correct: 0,
    rule: "« qu'on se dépêchera d'oublier », « indigence rare », « stériles » : le critique condamne sévèrement la pièce.",
    why: [null,"Le vocabulaire est entièrement défavorable.","Le jugement est tranché, pas neutre.","Il n'y a aucun point positif pour nuancer."] },
  { passage: "Les pompiers se font rares. Ils partagent leur vie entre leur métier, leur famille et la caserne. Gardes de week-end, astreintes de nuit, interventions, les pompiers volontaires ne comptent pas leur temps pour aider les autres. Mais l'évolution sociologique de la population rurale modifie les comportements. Les nouveaux habitants se portent moins souvent volontaires, et les centres de secours ont du mal à compléter leurs effectifs. Les difficultés de recrutement commencent à avoir des effets dans les plus petits des 8 000 centres établis sur l'ensemble du territoire.", question: "Qu'est-ce qui a modifié le recrutement des pompiers ?", options: ["L'intervention de l'État.","Des contraintes plus lourdes pour les centres.","Une vie professionnelle plus prenante.","Les changements qui touchent les campagnes."], correct: 3,
    rule: "« L'évolution sociologique de la population rurale » et l'arrivée de « nouveaux habitants » expliquent la baisse des volontaires : ce sont les changements des campagnes.",
    why: ["L'État tente de freiner la crise, il n'en est pas la cause.","Les centres subissent le problème, ils ne le causent pas.","La charge des pompiers n'a pas changé ; c'est la population qui change.",null] },
  { passage: "Le beaujolais nouveau arrive ce soir à minuit. Les initiatives se multiplient et les associations de vignerons fleurissent pour redorer l'image de ce vignoble toujours en crise. « On se serre les coudes. Le but est d'améliorer l'image en tirant la qualité par le haut, notamment avec les crus, explique Dominique Piron, président d'Expression d'origine, nouvelle structure rassemblant quinze domaines. On ne veut pas tuer le nouveau mais montrer qu'il n'y a pas de pensée et de vin unique en Beaujolais. »", question: "D'après cet article, pourquoi des actions doivent-elles être menées ?", options: ["Parce que ce vin ne s'exporte pas assez.","Pour rassembler les différents domaines.","Pour améliorer les conditions de production des vignobles.","Pour souligner la qualité et la variété de ce vin."], correct: 3,
    rule: "Le but est de « tirer la qualité par le haut » et de montrer « qu'il n'y a pas de vin unique » : valoriser la qualité et la diversité du beaujolais.",
    why: ["L'exportation n'est pas évoquée.","Le rassemblement des domaines est un moyen, pas le but.","On parle d'image et de qualité, pas des conditions de production.",null] },
  { passage: "Euforma vous accompagne depuis six ans. Six années d'évolutions, avec une équipe de rédaction dont la volonté constante a été de mieux informer ses lecteurs sur les programmes de leur université. Des rubriques pérennes ont été créées : Osez l'Europe ! Zooms thématiques ou dossiers spéciaux. Parce que Euforma doit encore évoluer pour mieux répondre à vos attentes, un questionnaire de satisfaction est aujourd'hui en ligne sur la page d'accueil du site Internet de l'agence. Vos réponses nous seront précieuses pour faire évoluer Euforma.", question: "Que propose le magazine à ses lecteurs ?", options: ["De fêter le sixième anniversaire de la publication.","De participer à la rédaction des articles.","De découvrir des changements éditoriaux.","De donner leur opinion sur leur journal."], correct: 3,
    rule: "Un « questionnaire de satisfaction » est en ligne et les réponses serviront à faire évoluer le magazine : on invite les lecteurs à donner leur avis.",
    why: ["Les six ans sont mentionnés, mais on ne propose pas de les fêter.","On ne propose pas d'écrire les articles.","Le but est de recueillir l'avis, pas d'annoncer des changements.",null] },
  { passage: "Le docteur Marrande, le plus illustre et le plus éminent des psychiatres, avait prié trois de ses confrères et quatre savants, s'occupant de sciences naturelles, de venir passer une heure chez lui, dans la maison de santé qu'il dirigeait, pour leur montrer un de ses malades. Aussitôt que ses amis furent réunis, il leur dit : « Je vais vous soumettre le cas le plus bizarre et le plus inquiétant que j'aie jamais rencontré… »", question: "Que souhaitait faire le docteur Marrande ?", options: ["Faire observer un de ses patients à ses pairs.","Recueillir l'avis de non-spécialistes.","Démontrer l'efficacité d'une thérapie originale.","Inaugurer un nouveau type d'établissement."], correct: 0,
    rule: "Il réunit des confrères et des savants « pour leur montrer un de ses malades » : il veut faire observer un patient à ses pairs.",
    why: [null,"Il invite des confrères et des savants, donc des spécialistes.","Il présente un cas, il ne démontre aucune thérapie.","La maison de santé existe déjà, rien n'est inauguré."] },
  { passage: "Sainte-Rose-du-Nord est un pays étonnant. Tout monte et descend dans ce morceau de terre. Même que le village québécois s'appelait jadis « la descente des femmes ». Il offre des points de vue qui donnent envie de se précipiter sur des pinceaux et de mettre de la couleur partout. Nous avions une petite place sur la terrasse. Un point de vue unique sur le fjord du Saguenay. Dommage ces fils et ces poteaux qui balafrent le décor. Comme des griffures sur un Picasso. Faudrait bannir les fils au pays de Sainte-Rose. Un vrai fléau !", question: "De quoi se plaint l'auteur de cet article ?", options: ["Du bruit que font les touristes.","Des installations électriques.","De l'isolement de ce village.","De rien en particulier."], correct: 1,
    rule: "L'auteur déplore « ces fils et ces poteaux qui balafrent le décor » : il se plaint des installations électriques.",
    why: ["Aucun bruit n'est évoqué.",null,"L'isolement n'est pas critiqué ; il admire le paysage.","Il exprime clairement une gêne (« un vrai fléau »)."] },
  { passage: "Le saviez-vous ? On aime plus ou moins son propre prénom. Plusieurs critères interviennent dans cette autoévaluation : une sonorité fluide ou le fait d'être court. Certaines sonorités du prénom peuvent influencer la perception de l'attrait physique. On trouve plus attirante une personne dont on apprécie la phonologie du prénom. Enfin, on a intérêt à porter un prénom commun plutôt qu'un prénom rare, car la familiarité est perçue positivement. Il a ainsi été découvert qu'une personne a plus de chances d'obtenir satisfaction à sa requête si son interlocuteur porte le même prénom qu'elle.", question: "Qu'explique l'article sur les liens entre le prénom porté et l'individu ?", options: ["La familiarité peut être créée grâce au fait de porter un prénom rare.","Une autoévaluation permet d'accepter un prénom qui n'est pas aimé.","L'attirance pour quelqu'un est renforcée par la consonance du prénom.","La répétition du prénom influe sur l'humeur de l'interlocuteur."], correct: 2,
    rule: "« On trouve plus attirante une personne dont on apprécie la phonologie du prénom » : la sonorité du prénom renforce l'attirance.",
    why: ["C'est le prénom commun, non rare, qui crée la familiarité.","L'autoévaluation mesure l'appréciation, elle ne fait pas accepter un prénom détesté.",null,"Le texte parle d'un prénom identique, pas d'une répétition."] },
  { passage: "Je forme une entreprise qui n'eut jamais d'exemple, et dont l'exécution n'aura point d'imitateur. Je veux montrer à mes semblables un homme dans toute la vérité de la nature ; et cet homme, ce sera moi. Moi seul. Je sens mon cœur, et je connais les hommes. Je ne suis fait comme aucun de ceux que j'ai vus ; j'ose croire n'être fait comme aucun de ceux qui existent. Que la trompette du jugement dernier sonne quand elle voudra, je viendrai, ce livre à la main, me présenter devant le souverain juge. Je dirai hautement : voilà ce que j'ai fait, ce que j'ai pensé, ce que je fus.", question: "À quel genre littéraire appartient cet extrait ?", options: ["Au journal intime.","À la biographie.","Au mémoire.","À l'autobiographie."], correct: 3,
    rule: "L'auteur raconte sa propre vie à la première personne (« cet homme, ce sera moi ») : c'est une autobiographie.",
    why: ["Un journal intime est une écriture datée au jour le jour, ce n'est pas le cas ici.","Une biographie est écrite par un autre sur la vie d'un tiers.","Les mémoires portent surtout sur les événements et le contexte, pas sur l'intériorité du « moi ».",null] },
  { passage: "Les gilets jaunes de sécurité, un vêtement multi-usage. Depuis le 5 octobre, cet accessoire est obligatoire et omniprésent. « C'est jaune, c'est moche, ça ne va avec rien » : en faisant la publicité du fameux « gilet jaune » de sécurité, le couturier Karl Lagerfeld n'avait sans doute pas pensé que celui-ci aurait de multiples usages. Dans bien des véhicules, il sert d'ornement pour le siège avant droit. Certains cyclistes roulant en ville l'ont adopté, alors que le gilet n'est obligatoire que la nuit hors agglomération. Les militants associatifs en ont fait un accessoire qui leur permet de se faire remarquer ; en forêt, les promeneurs l'enfilent pour être vus des chasseurs.", question: "Que nous apprend cet article ?", options: ["Le gilet jaune est un accessoire que les usagers rejettent pour son manque d'efficacité.","Le gilet jaune a ses détracteurs, mais est utilisé en dehors du cadre obligatoire.","Le gilet jaune est un accessoire chic et plébiscité par tous.","Le règlement stipule que le gilet jaune doit être utilisé par les cyclistes circulant en ville et par les chasseurs."], correct: 1,
    rule: "On le critique (« moche ») mais cyclistes, militants et promeneurs l'utilisent au-delà de l'obligation légale : il a des détracteurs et des usages multiples.",
    why: ["Il est très utilisé, pas rejeté.",null,"Il n'est pas trouvé « chic » (« c'est moche »).","Le port n'est obligatoire que la nuit hors agglomération, pas pour ces usages."] },
  { passage: "Chaque homme porte en lui son vécu, sa culture et, lors de ses migrations, l'entremêle à de nouvelles cultures et force est de constater que Paris est aujourd'hui une ville métisse. En tant qu'auteurs, nous avons souhaité, à travers l'exposition itinérante « Paris la Métisse », révéler les correspondances entre des êtres aux identités différentes et aux origines diverses. Notre reportage se veut être un témoignage humaniste d'un Paris métis à travers des photographies noir et blanc représentant des fragments de vie perçus au hasard des rues, des rencontres, des événements, des festivals, de la vie quotidienne…", question: "Quelle est la démarche adoptée par les responsables de cette exposition ?", options: ["Recueillir et diffuser les témoignages des visiteurs.","Mettre en scène des migrants dans différents lieux.","Présenter une série d'entretiens filmés dans les rues.","Photographier les ressemblances entre les habitants."], correct: 3,
    rule: "L'exposition « révèle les correspondances entre des êtres » au moyen de photographies : elle photographie les ressemblances entre habitants.",
    why: ["Ce sont les auteurs qui témoignent, pas les visiteurs.","Les scènes sont « perçues au hasard », non mises en scène.","Ce sont des photographies, pas des entretiens filmés.",null] },
  { passage: "Et si le marché intérieur chinois était le dernier eldorado pour les chefs d'entreprise ? C'est le pari qu'a fait Vincent, un Québécois spécialisé dans la crème glacée et installé, avec femme et enfants, à Hong Kong. Les affaires marchent bien : la population raffole de ses créations sucrées ! Vincent innove sans cesse. Petit secret du reportage : après quelques essais avec le raisin, Vincent travaille en ce moment sur un nouveau parfum : la glace au foie gras ! Sa société conquiert chaque année de nouvelles parts de marché. Vincent multiplie ses points de vente.", question: "Quel pari professionnel a fait Vincent ?", options: ["Redéfinir sa stratégie commerciale.","Diversifier ses services à la clientèle.","Implanter son entreprise à l'étranger.","Vendre ses produits à perte, au début."], correct: 2,
    rule: "Vincent, Québécois, a installé son entreprise à Hong Kong en pariant sur le marché chinois : il a implanté son entreprise à l'étranger.",
    why: ["Il innove sur les parfums, il ne refait pas sa stratégie.","Il varie ses parfums, pas ses « services ».",null,"Rien n'indique une vente à perte."] },
  { passage: "Une large majorité de Français est favorable à la modification du calcul de la retraite des fonctionnaires dans le cadre de la réforme en préparation, selon un sondage publié vendredi. Trois Français sur quatre (75 %) sont favorables à ce que les pensions des fonctionnaires soient calculées sur les salaires des dix dernières années et non plus des six derniers mois comme aujourd'hui, contre 25 dans le privé. Cette option ferait partie des pistes du rapport sur l'avenir des retraites qui doit être officiellement remis la semaine prochaine.", question: "Que présente le rapport sur l'avenir des retraites ?", options: ["Une harmonisation du mode de calcul pour tous les salariés.","Une indemnisation fixe par tranche d'années travaillées.","Une revalorisation du montant des primes de retraite.","Une réduction des écarts entre les secteurs publics et privés."], correct: 3,
    rule: "Le rapport propose de calculer les pensions des fonctionnaires comme dans le privé (dix dernières années) : il réduit l'écart public/privé.",
    why: ["Ce n'est pas une harmonisation totale, mais un rapprochement partiel.","Aucune indemnisation par tranche n'est évoquée.","Il n'est pas question de primes.",null] },
  { passage: "Le champagne fait un geste pour la planète. Le comité interprofessionnel des vins de champagne (CIVC) a annoncé mardi le lancement d'un nouveau standard de bouteille, plus légère de 65 grammes pour réduire l'émission de carbone de la filière. Cette innovation n'est cependant pas discernable à l'œil nu. Le poids actuel de la bouteille de champagne est de 900 grammes contre 450 à 500 grammes pour les autres vins. L'utilisation de la nouvelle bouteille, qui passe de 900 g à 835 g, doit réduire cette empreinte de 8 000 tonnes, l'équivalent de l'émission actuelle de 4 000 voitures.", question: "Qu'explique le texte à propos de l'innovation sur la bouteille de champagne ?", options: ["Le modèle reste inchangé.","La bouteille imite celle des vins.","Le changement est imperceptible.","Le matériau est plus résistant."], correct: 2,
    rule: "L'innovation (65 g de moins) « n'est cependant pas discernable à l'œil nu » : le changement est imperceptible.",
    why: ["La bouteille change bien de poids (900 vers 835 g).","Elle reste plus lourde que celle des autres vins, elle ne l'imite pas.",null,"On allège la bouteille ; le texte ne dit pas qu'elle est plus résistante."] },
  { passage: "Si nous jetons un coup d'œil sur nos expositions de tableaux modernes, nous sommes frappés de la tendance générale des artistes à habiller tous les sujets de costumes anciens. Presque tous se servent des modes et des meubles de la Renaissance, comme David se servait des modes et des meubles romains. C'est évidemment le signe d'une grande paresse ; car il est beaucoup plus commode de déclarer que tout est laid dans l'habit d'une époque, que de s'appliquer à en extraire la beauté mystérieuse qui y peut être contenue. La modernité, c'est le transitoire, le fugitif, le contingent, la moitié de l'art, dont l'autre moitié est l'éternel et l'immuable.", question: "Dans cet essai, pourquoi Baudelaire critique-t-il les peintres de son époque ?", options: ["Ils méprisent l'héritage antique.","Ils vouent une admiration trop importante aux œuvres anciennes.","Ils créent des œuvres auxquelles il manque l'éternel et l'immuable.","Ils n'intègrent pas la modernité à leurs représentations."], correct: 3,
    rule: "Les peintres habillent leurs sujets de costumes anciens au lieu de saisir « le transitoire, le fugitif » : ils négligent la modernité dans leurs œuvres.",
    why: ["Au contraire, ils s'attachent trop au passé.","Leur attachement au passé est le symptôme, pas le reproche central.","C'est la modernité (le transitoire) qui manque, pas l'éternel et l'immuable.",null] },
  { passage: "Comment expliquer le succès récent des activités d'altitude, de ces sports pratiqués en pleine nature ? Pourquoi la montagne est-elle si fréquentée qu'elle en devient une « version jour de la boîte de nuit » ? Des sociologues avancent une réponse : rien n'est plus culturel que la « nature », façonnée par la main de l'homme depuis des siècles. En fait, la nature est un espace où l'on se projette et dans lequel on vient réaliser des rêves en partie stéréotypés. Le touriste représente ainsi sans le savoir une figure héroïque : il est un combattant ! Il devient le sportif qui se bat contre lui-même ou contre le temps.", question: "Que recouvre l'engouement actuel des séjours à la montagne ?", options: ["La quête de défis.","La communion dans l'effort.","La soif de liberté.","La nostalgie de la nature."], correct: 0,
    rule: "Le touriste y devient « une figure héroïque », « un combattant » qui « se bat contre lui-même » : la montagne répond à une quête de défis.",
    why: [null,"Le texte parle d'un combat individuel, pas d'une communion collective.","La liberté n'est pas le ressort évoqué.","La « nature » est dite culturelle ; il n'est pas question de nostalgie."] },
  { passage: "Il est 17 heures. Je suis chez Paul. Je rentre à la maison à 19 heures. On mange à 20 heures ou plus tard ? Bises. Julie", question: "À quelle heure va arriver Julie ?", options: ["À 19 heures.","À 17 heures.","À 21 heures.","À 20 heures."], correct: 0,
    rule: "Julie écrit « Je rentre à la maison à 19 heures » : elle arrivera donc à 19 heures.",
    why: [null,"17 heures est l'heure actuelle (« il est 17 heures »).","21 heures n'est pas mentionné.","20 heures est l'heure du repas, pas de son arrivée."] },
  { passage: "Nous allons au parc avec Stéphanie. Est-ce que tu veux venir avec nous ? On se retrouve devant l'entrée dans un quart d'heure ? À tout de suite ! Anne", question: "Que propose Anne dans ce message ?", options: ["Un emploi.","Une aide.","Un service.","Un rendez-vous."], correct: 3,
    rule: "Anne propose de se retrouver « devant l'entrée dans un quart d'heure » : c'est un rendez-vous.",
    why: ["Aucun emploi n'est proposé.","Elle n'offre pas son aide.","Elle ne demande pas de service.",null] },
  { passage: "Festival international du cinéma. Ce Pass donne accès à tous les films pour 1 € seulement, du 16 mars 2007, 21 heures au 17 mars 2007, minuit.", question: "Ce Pass est valable :", options: ["Une semaine.","Un an.","Un jour.","Un mois."], correct: 2,
    rule: "Le Pass est valable du 16 mars au 17 mars : environ une journée.",
    why: ["La durée est bien inférieure à une semaine.","Ce n'est pas un an.",null,"Ce n'est pas un mois."] },
  { passage: "De : paul@message.org. À : loic@moncourriel.asso.fr. Objet : Demain. Loïc, tu viens toujours me chercher demain ? Mon train arrive à 11h. Merci, Paul", question: "Que doit faire Loïc ?", options: ["Réserver une place.","Prendre un train.","Acheter un billet.","Aller à la gare."], correct: 3,
    rule: "Paul demande à Loïc de « venir le chercher » à l'arrivée de son train : Loïc doit aller à la gare.",
    why: ["Aucune réservation n'est demandée.","C'est Paul qui prend le train.","Aucun billet à acheter.",null] },
  { passage: "Hier, tu n'es pas venu. Je t'ai attendu 1 heure devant le cinéma dans le froid. N'oublie pas notre rendez-vous ce soir au restaurant ! Envoie-moi un message et dis-moi à quelle heure on se rencontre. Sarah.", question: "Pourquoi Sarah a-t-elle écrit ce message ?", options: ["Pour annuler un dîner au restaurant avec son ami.","Pour changer la date d'un rendez-vous au cinéma.","Pour demander une confirmation de rendez-vous.","Pour donner un rendez-vous à son ami."], correct: 2,
    rule: "Sarah rappelle le rendez-vous du soir et demande « à quelle heure on se rencontre » : elle veut une confirmation.",
    why: ["Elle maintient le dîner, elle ne l'annule pas.","Le rendez-vous du cinéma est passé ; elle parle de celui du soir.",null,"Le rendez-vous existe déjà ; elle cherche à le confirmer."] },
  { passage: "Monsieur, Pour faire suite à votre courrier, je me rendrai avec grand plaisir à la présentation du programme de la nouvelle saison de votre théâtre. Je serai accompagné d'une personne. Cordialement, Jean Duquesnes", question: "Pourquoi la personne écrit-elle ce message ?", options: ["Pour répondre à une invitation.","Pour demander des renseignements.","Pour obtenir une confirmation.","Pour faire une réclamation."], correct: 0,
    rule: "« Pour faire suite à votre courrier » et « je me rendrai avec grand plaisir » : Jean Duquesnes répond à une invitation reçue.",
    why: [null,"Il ne demande aucun renseignement.","C'est lui qui confirme sa venue.","Il ne se plaint de rien."] },
  { passage: "Recup'points. Faites un stage pour récupérer vos points de permis de conduire (sessions sur un week-end ou plusieurs soirées). Prix intéressants. Inscrivez-vous vite sur notre site : www.recupointspermis.fr", question: "Que représente ce document ?", options: ["Une publicité.","Une notice.","Une consigne de sécurité.","Une invitation."], correct: 0,
    rule: "Le texte vante un service (« Prix intéressants », « Inscrivez-vous vite ») : c'est une publicité.",
    why: [null,"Une notice explique un mode d'emploi, ce n'est pas le cas.","Il n'y a aucune consigne de sécurité.","Ce n'est pas une invitation personnelle."] },
  { passage: "Tarifs 2007. Plein tarif 12,50 euros (hors expositions temporaires). Tarif réduit 8,50 euros (familles nombreuses, étudiants, seniors). Gratuit (demandeurs d'emploi, groupes scolaires accompagnés, moins de 18 ans, enseignants).", question: "Ce panneau se trouve dans :", options: ["Un théâtre.","Une piscine.","Une bibliothèque.","Un musée."], correct: 3,
    rule: "La mention « hors expositions temporaires » et les tarifs réduits pour scolaires et enseignants indiquent un musée.",
    why: ["Un théâtre vend des places de spectacle, pas des « expositions ».","Une piscine ne propose pas d'expositions.","Une bibliothèque est généralement gratuite.",null] },
  { passage: "Salut Omar, Je rentre tard ce soir car je mange au restaurant. S'il te plaît, n'oublie pas de donner à manger au chat, sa boîte est dans le frigo. Merci, Ali.", question: "Que doit faire Omar ?", options: ["Faire des courses.","Nourrir le chat.","Dîner avec Ali.","Préparer le repas."], correct: 1,
    rule: "Ali demande à Omar de « donner à manger au chat » : il doit nourrir le chat.",
    why: ["Aucune course n'est demandée.",null,"Ali mange au restaurant, pas avec Omar.","Aucun repas à préparer."] },
  { passage: "Bonjour ! Voilà, l'année à l'université se termine. Pour fêter ça, je vous invite tous dans mon nouvel appartement vendredi soir à 20 h. Je peux ramener en voiture ceux qui habitent loin. J'attends vos réponses. À bientôt ! Marie", question: "Que fête Marie ?", options: ["Son emménagement.","La fin des cours.","Son anniversaire.","L'achat de sa voiture."], correct: 1,
    rule: "« L'année à l'université se termine. Pour fêter ça… » : Marie fête la fin des cours.",
    why: ["Le nouvel appartement est le lieu, pas la raison de la fête.",null,"Aucun anniversaire n'est mentionné.","La voiture sert à ramener les invités, ce n'est pas l'événement fêté."] },
  { passage: "Paris, le samedi 1er juin. Madame, J'ai l'honneur et la joie de vous informer de la naissance de mon enfant en date du 8 octobre. Aussi je souhaiterais bénéficier de mes 3 jours de congés du 15 octobre au 18 octobre, conformément aux dispositions du Code du Travail relatif aux événements familiaux. Dans l'attente de votre réponse, veuillez agréer, Madame, Monsieur, l'expression de mes salutations distinguées. Monsieur Ribaud", question: "Que fait M. Ribaud ?", options: ["Il rappelle un événement.","Il demande un repos.","Il annonce une naissance.","Il cherche du travail."], correct: 1,
    rule: "Il « souhaiterait bénéficier de [ses] 3 jours de congés » : le but de la lettre est de demander un congé (un repos).",
    why: ["La naissance est le motif, pas l'objet de la demande.",null,"Il annonce la naissance, mais le but de la lettre est la demande de congé.","Il a déjà un emploi."] },
  { passage: "Nous vous remercions de votre intérêt pour notre établissement et vous confirmons que nous avons reçu votre dossier d'inscription pour la semaine du 5 avril. Nous vous ferons parvenir très bientôt le calendrier complet du programme. Pour toutes autres demandes, nous vous prions de bien vouloir vous adresser directement à la personne en charge de votre programme.", question: "Quelle information est communiquée à la personne qui reçoit cette lettre ?", options: ["Le changement des dates.","Les conditions d'acceptation.","Les procédures de recrutement.","La suite donnée à son dossier."], correct: 3,
    rule: "On confirme la réception du dossier et l'envoi prochain du calendrier : c'est le suivi (la suite) donné au dossier.",
    why: ["Les dates ne changent pas.","Aucune condition d'acceptation n'est posée.","Il ne s'agit pas de recrutement.",null] },
  { passage: "Notre magazine a décidé de réunir les actualités les plus originales, les plus comiques publiées dans la presse dite « sérieuse » et sur Internet. Un canard adopté par un chat, un cambrioleur qui s'endort sur le canapé de sa victime, un perroquet capable de tenir une conversation… c'est insolite, surtout inutile mais ça fait rire tout le monde. Ces histoires d'une vie, d'un moment, sont sans doute à faire partager au plus grand nombre mais surtout vous faire réfléchir à ce dont vous n'auriez sans doute jamais pensé avant…", question: "Que propose le magazine ?", options: ["Des histoires drôles tirées de la vie quotidienne.","Des caricatures de la presse internationale.","Des réflexions sur les grands thèmes d'actualité.","Des nouvelles pour être partagées sur internet."], correct: 0,
    rule: "Le magazine réunit des actualités « comiques » et « insolites » qui « font rire » : des histoires drôles de la vie quotidienne.",
    why: [null,"Il s'agit de faits insolites, pas de caricatures.","Le ton est léger, pas une réflexion sur de grands thèmes.","Le partage en ligne est secondaire ; l'essentiel est l'humour."] },
  { passage: "Salon Jeunes diplômés les 25 et 26 avril. Vous avez entre 23 et 28 ans. Vous êtes diplômés en Ingénierie informatique. Vous êtes motivés, dynamiques et organisés. Munissez-vous de votre CV et venez nous rencontrer au salon Jeunes Diplômés.", question: "Quel est le but de cette annonce ?", options: ["Informer sur la création d'un nouveau diplôme.","Présenter une nouvelle méthode de rédaction de CV.","Proposer l'organisation d'une conférence.","Annoncer un événement de recrutement."], correct: 3,
    rule: "On invite de jeunes diplômés à venir avec leur CV rencontrer des employeurs : c'est un événement de recrutement.",
    why: ["Aucun nouveau diplôme n'est créé.","On demande d'apporter un CV, on n'enseigne pas à le rédiger.","Ce n'est pas une conférence mais un salon.",null] },
  { passage: "Collecte de sang. Donnez votre sang. Nous serons dans votre ville demain de midi à 16h sur la place de l'hôtel de ville. Le Centre de Transfusion Sanguine souhaiterait venir tous les mois avec un camion d'aphérèse. En effet, le Centre a besoin de plaquettes et de plasma afin de subvenir à des besoins ponctuels. Toute personne désireuse de donner en aphérèse peut se faire connaître afin que nous établissions une liste de donneurs potentiels susceptibles d'être sollicités rapidement. Nous comptons sur votre générosité.", question: "L'annonce s'adresse à :", options: ["De futurs médecins spécialisés dans la collecte de sang et plaquettes.","Des patients en attente d'une transfusion.","Des donneurs potentiels.","Un centre de transfusion sanguine."], correct: 2,
    rule: "Le texte appelle « toute personne désireuse de donner » à se faire connaître : il s'adresse aux donneurs potentiels.",
    why: ["Il ne recrute pas de médecins.","Il vise les donneurs, pas les receveurs.",null,"C'est le centre qui émet l'annonce, il n'en est pas le destinataire."] },
  { passage: "Recevez 10 euros en bons cadeaux pour 50 euros d'achat.", question: "Cette carte indique que :", options: ["L'acheteur pourra gagner de 10 à 50 euros en cadeaux.","L'acheteur aura des bons cadeaux s'il dépense 50 euros au moins.","L'acheteur recevra des bons cadeaux s'il dépense au moins 10 euros.","L'acheteur sera remboursé de 10 euros à partir de 50 euros d'achat."], correct: 1,
    rule: "Il faut acheter pour 50 euros afin de recevoir 10 euros en bons : l'acheteur obtient les bons à partir de 50 euros dépensés.",
    why: ["Le cadeau est fixe (10 euros), pas une fourchette de 10 à 50.",null,"Le seuil est de 50 euros d'achat, pas 10.","Ce sont des bons cadeaux, pas un remboursement."] },
  { passage: "Le cours de M. Poulain n'aura pas lieu aujourd'hui. Il sera reporté ultérieurement.", question: "L'affiche informe que :", options: ["Le cours aura lieu demain.","Le cours a eu lieu aujourd'hui.","M. Poulain est souffrant.","Le cours aura lieu à une autre date."], correct: 3,
    rule: "Le cours « sera reporté ultérieurement » : il aura lieu à une autre date.",
    why: ["« Ultérieurement » ne signifie pas forcément demain.","Le cours n'a justement pas lieu aujourd'hui.","La raison de l'annulation n'est pas donnée.",null] },
  { passage: "7 jours sur la planète. Cette semaine, nous vous proposons une émission spéciale qui répond à l'un de vos vœux les plus chers : découvrir les coulisses de « 7 jours sur la planète ». Car vous êtes toujours plus nombreux à nous demander comment le magazine se prépare. Cette émission particulière a donc pour objectif de répondre à votre curiosité et de vous éclairer sur notre travail, celui de « 7 jours sur la planète » mais aussi celui de toute une rédaction.", question: "Quelle est la particularité de cette émission ?", options: ["Elle a été réalisée à la demande du public.","Elle a été produite en une semaine.","Elle a été tournée dans un théâtre.","Elle a été rediffusée sept fois."], correct: 0,
    rule: "L'émission répond « à l'un de vos vœux » car « vous êtes toujours plus nombreux à nous demander » : elle est faite à la demande du public.",
    why: [null,"Le titre évoque « 7 jours » mais rien sur une production en une semaine.","Aucun théâtre n'est mentionné.","Aucune rediffusion n'est évoquée."] },
  { passage: "La qualité du français utilisé dans les médias québécois est acceptable, mais perfectible. « L'avenir du français dans l'information est plutôt rassurant. Au fil des ans, les secteurs de la presse écrite et de l'information radio et télévision ont été moins touchés par les excès de familiarité », écrit Guy Bertrand, conseiller linguistique à Radio-Canada. « Les bafouillages, les lapsus, les tournures lourdes ou un peu maladroites sans gravité sont excusables dans une émission où l'improvisation tient une place importante », dit-il. « Dans la plupart des médias, la simplicité, la convivialité et, dans une certaine mesure, la familiarité sont des qualités médiatiques. »", question: "Qu'affirme le conseiller linguistique de Radio-Canada ?", options: ["Les journalistes peuvent, de manière raisonnable, se permettre certaines familiarités.","Les journalistes parlent un français soutenu et beaucoup plus convenable qu'avant.","Les journalistes devraient davantage improviser et rendre leur français moins familier.","Les journalistes devraient rendre leur français moins convivial et surtout plus simple."], correct: 0,
    rule: "Pour le conseiller, « la familiarité » est une « qualité médiatique » et les maladresses « sans gravité » sont « excusables » : une certaine familiarité est acceptable.",
    why: [null,"Il juge la langue « perfectible », pas « beaucoup plus convenable ».","Il accepte une certaine familiarité, il ne demande pas de la réduire.","Il valorise la convivialité, il ne demande pas de la diminuer."] },
  { passage: "Cycle de conférence : l'entretien de recrutement par Philippe Villemus. Jeudi 22 avril 2010 à 14 heures. Comme tous les ans, cette conférence sera centrée sur l'entretien de recrutement. Philippe Villemus exposera son approche scientifique visant à aider les recruteurs à mieux choisir parmi les postulants et expliquera comment créer de bonnes conditions pour un entretien d'embauche efficace. Il apportera également des conseils pour les futurs recrutés.", question: "Sur quoi portera cette conférence ?", options: ["Sur la façon de mieux aborder l'entretien de recrutement.","Sur la présentation des prochains postes à pourvoir.","Sur l'intérêt de se diriger vers une filière scientifique.","Sur le compte rendu annuel du moral des recruteurs."], correct: 0,
    rule: "La conférence est « centrée sur l'entretien de recrutement » et explique comment le réussir : comment mieux aborder l'entretien.",
    why: [null,"Aucun poste précis n'est présenté.","« Scientifique » qualifie l'approche, pas un choix de filière.","Il ne s'agit pas d'un bilan sur le moral des recruteurs."] },
  { passage: "« Ulysse en Gaule ». Connaissez-vous la cuisine grecque ? Quelle que soit la réponse, allez la découvrir ou la redécouvrir dans ce restaurant-traiteur où vous êtes accueillis à bras ouverts par Chryssoula. Dans ce quartier où foisonnent les restaurants grecs, chacun sait qu'elle prépare mieux que personne les recettes typiques de son pays d'origine. Arrivée en France voilà vingt-cinq ans, la patronne a fait du chemin à force de labeur et de conviction. Aujourd'hui, elle régale ses hôtes et l'on revient souvent à sa table. La cuisine grecque comme nulle part ailleurs !", question: "Pourquoi est-il conseillé de se rendre au restaurant de Chryssoula ?", options: ["Il est unique dans le quartier.","Il offre une cuisine authentique.","Il propose des prix intéressants.","Il reçoit une clientèle jeune."], correct: 1,
    rule: "Chryssoula « prépare mieux que personne les recettes typiques de son pays d'origine » : on y mange une cuisine authentique.",
    why: ["Le quartier compte beaucoup de restaurants grecs ; il n'est pas unique.",null,"Les prix ne sont pas évoqués.","La clientèle n'est pas décrite comme jeune."] },
  { passage: "Il y a 25 ans, l'ultime cours de Michel Foucault au Collège de France. Quelques semaines avant de mourir, en 1984, le philosophe Michel Foucault donnait son dernier cours au Collège de France. Un quart de siècle après, la publication de ses conférences publiques permet d'entendre une parole éblouissante. Ce professeur dont les cours attiraient les foules et suscitaient l'enthousiasme, comme le rappelle l'historien Paul Veyne, détestait la position magistrale. Penseur des marges et de la délinquance, il a tout essayé pour échapper aux effets d'autorité symbolique instaurés par son rôle et son aura.", question: "Quelle est la phrase qui correspond le mieux aux propos du journaliste ?", options: ["Michel Foucault a toujours aimé les controverses anciennes/modernes.","Michel Foucault a laissé de nombreux écrits sur la vie philosophique.","Michel Foucault est redécouvert grâce à de nouvelles publications.","Michel Foucault est mort juste après son dernier cours."], correct: 2,
    rule: "« La publication de ses conférences permet d'entendre une parole éblouissante » : on le redécouvre grâce à de nouvelles publications.",
    why: ["Le texte n'évoque pas un goût pour ces controverses.","Ce sont ses conférences (orales) qui sont publiées, pas des écrits laissés par lui.",null,"Il est mort « quelques semaines après », pas « juste après »."] },
  { passage: "Climat. L'Antarctique se réchauffe. L'Antarctique s'est réchauffée au cours des cinquante dernières années, selon une étude américaine publiée jeudi 22 janvier dans la revue Nature. Les rares données disponibles indiquaient jusqu'alors un réchauffement de la péninsule antarctique, mais un net refroidissement du centre du continent. La nouvelle reconstitution statistique suggère que, dans l'ouest, la température s'est élevée de 0,1 °C par décennie, notamment en hiver et au printemps, compensant un refroidissement moindre de la partie est à l'automne. Le mécanisme responsable de ce réchauffement régional reste mal compris.", question: "Quelle est l'origine de la surprise des scientifiques ?", options: ["Ils pensaient que l'Antarctique était une région plus froide dans sa partie est.","Ils se doutaient qu'un réchauffement climatique général se produisait depuis dix ans.","Les statistiques montrent qu'une partie de l'Antarctique se réchauffe plus vite qu'initialement constaté.","Ils comprennent mal le phénomène de réchauffement dans la partie Ouest."], correct: 3,
    rule: "La nouvelle étude révèle un réchauffement de l'ouest dont « le mécanisme reste mal compris », alors qu'on croyait à un refroidissement : d'où la surprise.",
    why: ["Les données antérieures portaient sur un refroidissement du centre, pas sur un est plus froid.","Le réchauffement constaté couvre cinquante ans, pas dix.","Le texte insiste sur un réchauffement inattendu et mal compris, pas sur une vitesse supérieure à un constat antérieur.",null] },
  { passage: "BRÉSIL. São Paulo et Rio : à l'occasion de l'année de la France au Brésil, les deux villes phares du Brésil contemporain se laissent découvrir à travers une exploration libre des médias. Interviews, portraits vidéos, reportages photographiques, sons : rencontres avec des acteurs de la francophonie et des représentants de la culture brésilienne.", question: "Quel regard sur les deux villes a été choisi ?", options: ["Journalistique.","Linguistique.","Cinématographique.","Politique."], correct: 0,
    rule: "Interviews, reportages photographiques, portraits vidéos : c'est un regard journalistique, porté par les médias.",
    why: [null,"La francophonie est un thème, pas le regard porté.","Ce ne sont pas des films mais un travail de médias variés.","Le regard n'est pas politique."] },
  { passage: "À Amsterdam, Angèle a appris à dresser son œil. Photographe de renommée internationale, elle multiplie les expos et le prix de ses tirages s'envole. Native du Cameroun, la jeune femme n'a jamais regretté le choix des Pays-Bas. Elle y a trouvé, dit-elle, « un vent de liberté tout à fait inédit ». À force d'obstination et de travail (elle a mis seulement 6 mois à apprendre le néerlandais), Angèle est devenue une artiste « qui compte ».", question: "Quel titre résume le parcours d'Angèle ?", options: ["Des décisions difficiles.","Une émigration réussie.","L'adaptation à la vie citadine.","La dure leçon du photographe."], correct: 1,
    rule: "Camerounaise installée aux Pays-Bas, devenue « une artiste qui compte » sans regret : c'est une émigration réussie.",
    why: ["Elle ne regrette pas son choix ; rien n'est présenté comme difficile.",null,"Le sujet est sa réussite à l'étranger, pas l'adaptation urbaine.","Son parcours est une réussite, pas une dure leçon."] },
  { passage: "Plus près du paradis. Des senteurs, un feu d'artifice de saveurs et soudain vous êtes transportés… à Bali, dans un monde de douceur. Cette ambassade d'Indonésie, près du Louvre, joue la cuisine délicate avec des produits de première qualité. Optez pour la table de riz Bandung et vous verrez arriver une myriade de petits plats dont les satés Ayam (brochettes de poulet à la sauce cacahuète) et le bœuf mijoté au lait de coco. Superbe carte des vins. Les vendredis soirs, un spectacle de danses balinaises. Réservation fortement conseillée.", question: "De quoi traite cet article ?", options: ["D'un restaurant raffiné.","D'un voyage organisé.","D'un événement culturel.","D'un service consulaire."], correct: 0,
    rule: "On décrit une « cuisine délicate », une « superbe carte des vins » et une réservation conseillée : c'est un restaurant raffiné.",
    why: [null,"« Transportés à Bali » est une image ; ce n'est pas un voyage.","Les danses sont une animation du restaurant, pas l'objet de l'article.","« Ambassade d'Indonésie » est une métaphore, pas un vrai consulat."] },
  { passage: "Séoul pourrait sans doute remporter le titre de la ville au plus grand nombre de restaurants par habitant. Mais face à un tel choix, il est naturel d'éprouver un certain embarras : comment choisir le bon restaurant dans une rue qui peut en contenir des dizaines ? Voici une règle toute simple qui vous permettra de trouver de manière infaillible la meilleure cuisine de la capitale : il vous suffit de regarder la carte. Une offre pléthorique de plats divers et variés ? Passez votre chemin. Une spécialité clairement définie, comme le poisson, le tofu ou le poulet ? Bon signe.", question: "Pourquoi est-il difficile de choisir un restaurant à Séoul ?", options: ["Les guides manquent de précisions.","Les adresses sont mal indiquées.","Les noms des plats sont inconnus.","Les établissements sont innombrables."], correct: 3,
    rule: "Une seule rue « peut en contenir des dizaines » : le choix est difficile car les restaurants sont innombrables.",
    why: ["Le texte ne parle pas de guides imprécis.","Les adresses ne sont pas en cause.","Le problème est le nombre, pas les noms des plats.",null] },
  { passage: "Qui peut nier qu'aujourd'hui, disposer de moyens de paiement, quel que soit le niveau de revenus perçus, relève de la plus élémentaire des nécessités sociales ? Mais cette nécessité a-t-elle pour autant été érigée en droit ? Dans notre société, c'est aux établissements bancaires en situation de monopole sur les moyens de paiement qu'il appartient partout d'en décider. Leur pouvoir discriminatoire consiste purement et simplement à sélectionner ceux qui méritent de détenir un compte, assorti des services les plus courants. Cette situation d'exclusion, aussi bien éphémère que durable, traverse toutes les catégories socioprofessionnelles, touchant des personnes de tous les âges, de tous les revenus.", question: "Que dénonce principalement l'auteur de cet article ?", options: ["La durée arbitraire de l'exclusion bancaire décidée par les banques à l'encontre de leurs clients.","La décision des banques d'exclure systématiquement les plus démunis des moyens de paiement courants.","La dépendance des banques à la conjoncture économique générale qui les empêche d'agir librement.","La décision arbitraire de banques de donner accès ou non à leurs services à certaines personnes."], correct: 3,
    rule: "L'auteur dénonce le « pouvoir discriminatoire » des banques qui « sélectionnent ceux qui méritent » un compte : une décision arbitraire d'accès aux services.",
    why: ["Ce n'est pas la durée qui est visée, mais le pouvoir de décider.","L'exclusion touche tous les revenus, pas seulement les plus démunis.","Les banques décident librement (monopole) ; elles ne sont pas empêchées d'agir.",null] },
  { passage: "Votre contrat. Son numéro : BB 23012009 BB. Véhicule assuré : JET Confort. Conducteur déclaré : Monsieur Bernard Lenteur. Usage : Privé professionnel (fonctionnaires et assimilés). Garanties : Responsabilité civile, dommages tous accidents, vol, incendie, bris de glaces, dommages corporels du conducteur, assistance 50 km, équipement hors série et contenu. Franchises : 400 euros en catastrophes naturelles, 250 euros en dommages tous accidents, 100 euros en prêt au volant, 500 euros en prêt au volant si le conducteur est novice. Votre cotisation annuelle : 870 euros.", question: "Quelle est la proposition qui correspond le mieux à ce contrat d'assurance ?", options: ["L'assuré est le seul conducteur autorisé par l'assurance.","L'assuré est couvert lors d'un usage personnel de son véhicule.","Les frais sont intégralement pris en charge en cas d'accident de la route.","L'assurance rembourse tous les frais de dépannage quelle que soit la distance entre le lieu d'assistance et le domicile."], correct: 1,
    rule: "L'usage est « Privé professionnel » : l'assuré est donc couvert aussi pour un usage personnel du véhicule.",
    why: ["Le « prêt au volant » est prévu, donc d'autres peuvent conduire.",null,"Des franchises restent à la charge de l'assuré ; la prise en charge n'est pas totale.","L'assistance est limitée à 50 km, pas à toute distance."] },
  { passage: "Mutuelle des Enseignants et des Étudiants Francophones – MEEF. Monsieur, Afin de prolonger la validité de votre carte (suite à l'enregistrement des modifications de votre dossier administratif), nous vous invitons à procéder à la mise à jour de votre Carte Vitale, en utilisant une borne télématique. Motif de la mise à jour : mutation au 01/01/2009. La mise à jour effectuée, prenez contact avec nos services pour l'édition d'une nouvelle attestation VITALE.", question: "Pourquoi l'assuré doit-il prolonger la validité de sa carte ?", options: ["Il a changé de statut.","Elle permet l'émission d'une nouvelle carte.","Il ne peut pas le faire directement à une borne.","Elle était périmée."], correct: 0,
    rule: "Le motif est une « mutation au 01/01/2009 » (modification du dossier) : l'assuré a changé de situation.",
    why: [null,"La mise à jour permet une nouvelle attestation, mais la raison est le changement de situation.","On lui demande justement d'utiliser une borne.","La carte n'est pas dite périmée, mais à mettre à jour."] },
  { passage: "Écologiste de la première heure, Jean-Louis Étienne vient d'achever une traversée du pôle Nord, dans le but de récolter des données scientifiques sur la régression de la banquise. « Je joue d'abord un rôle citoyen. Je côtoie en permanence les écoles, du primaire aux hautes études. En fait, le citoyen ne perçoit pas le réchauffement climatique. La Terre s'est réchauffée de 0,8 °C en un siècle, le percevoir est impossible ! Le CO2 est invisible, inodore, il agit sur des décennies… C'est difficile à identifier. Par une pédagogie simple, je cherche à faire comprendre l'urgence de la situation. »", question: "Quel est le but de Jean-Louis Étienne ?", options: ["Conserver à la langue française son caractère international.","Expliquer aux citoyens que la planète est en danger.","Aider à relativiser l'impact du changement climatique.","Convaincre les lycéens de faire des études en sciences."], correct: 1,
    rule: "« Par une pédagogie simple, je cherche à faire comprendre l'urgence de la situation » : il veut alerter les citoyens sur le danger climatique.",
    why: ["La langue française n'est pas son sujet.",null,"Il veut alerter sur l'urgence, pas relativiser.","Il côtoie les écoles pour sensibiliser, pas pour orienter vers les sciences."] },
  { passage: "Trouver des solutions pour limiter les bouchons endémiques est une priorité pour la municipalité de São Paulo. Parmi les mesures adoptées : l'accès au métro pour les vélos personnels dans certaines rames et en dehors des périodes d'affluence. Ces mesures favorisent surtout le déplacement de loisir. L'arrivée timide, en décembre 2008, des vélos en libre-service ne semble pas changer les habitudes des Paulistes. Il est vrai que le nombre de 202 vélos Usebike pour 11 millions d'habitants reste symbolique. Avec seulement 5 lignes de métro en service – et 2 de plus en construction –, le transport continue de s'effectuer surtout en surface avec le bus et la voiture.", question: "À quel enjeu la ville de São Paulo se confronte-t-elle ?", options: ["Faciliter la circulation dans la ville.","Résorber les accidents dans la ville.","Rénover le parc automobile de la ville.","Limiter le nombre de vélos en ville."], correct: 0,
    rule: "La priorité est de « limiter les bouchons endémiques » : faciliter la circulation dans la ville.",
    why: [null,"Le texte parle d'embouteillages, pas d'accidents.","Il n'est pas question de renouveler les voitures.","On cherche au contraire à développer le vélo."] },
  { passage: "Le marquis la reçut de mauvaise grâce, debout dans le vestibule, et mit un certain temps à comprendre ce qu'elle voulait car c'était une femme aux mots remâchés et aux circonlocutions amphigouriques. Elle tournait tant autour du pot et plus encore, que le marquis perdit patience. – Si vous voulez me dire quelque chose, arrêtez ce galimatias, lança-t-il. – Une épidémie de rage nous menace, dit Sagunta, et je suis la seule à posséder les pains de Saint-Hubert, patron des chasseurs et guérisseur des enragés. – Je ne vois nul signe d'épidémie, répondit le marquis. (Gabriel Garcia Marquez, De l'amour et autres démons)", question: "De quoi le marquis est-il prévenu ?", options: ["D'une calamité cosmique.","D'une catastrophe climatique.","D'une maladie terrible.","D'une malédiction divine."], correct: 2,
    rule: "Sagunta annonce « une épidémie de rage » : le marquis est prévenu d'une maladie terrible.",
    why: ["Le marquis évoque comètes et éclipses pour s'en moquer ; ce n'est pas l'avertissement reçu.","Aucune catastrophe climatique n'est annoncée.",null,"La rage est une maladie, pas une malédiction divine."] },
  { passage: "LES LANGUES ÉTRANGÈRES : DES MATIÈRES MORTES. – Comment remédier à cette tendance qui existe en France à enseigner les langues étrangères comme des matières mortes ? – La façon même de concevoir l'enseignement doit sans doute être repensée, afin qu'il accorde plus de place à l'expression orale et soit moins formaliste. Au-delà, il serait utile de multiplier les échanges d'enseignants entre les pays européens. Le nombre de cours dispensés en anglais, en allemand ou en espagnol devrait aussi augmenter au fil des années de scolarité. Tout ce qui peut favoriser une proximité quotidienne avec les langues étrangères doit être encouragé. Les séjours linguistiques aussi devraient être quasi-obligatoires pour tous.", question: "De quoi est-il question dans cet article ?", options: ["L'amélioration des conditions des étudiants de langues.","La réforme en France pour s'aligner sur le système européen.","Les dispositions pour attirer des étudiants européens.","La réfection entière du système d'enseignement."], correct: 3,
    rule: "Repenser l'enseignement, multiplier les échanges, augmenter les cours en langue, rendre les séjours quasi-obligatoires : c'est une refonte complète de l'enseignement des langues.",
    why: ["Il s'agit de la méthode d'enseignement, pas des conditions matérielles des étudiants.","L'objectif est pédagogique, pas l'alignement administratif sur l'Europe.","On ne cherche pas à attirer des étudiants étrangers.",null] },
