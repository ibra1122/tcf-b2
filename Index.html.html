    why: ["« grave » qualifie une situation sérieuse mais pas un risque physique d'action.", "« sévère » se dit d'une personne stricte ou d'une punition.", null, "« sérieux » signifie important/réfléchi, pas risqué."] },

    why: ["« auteur » désigne celui qui fait l'acte, pas la responsabilité juridique dans cette tournure.", "« cadre » est un poste ou un contexte.", "« garant » se construit avec « se porter garant », pas « tenu pour garant » dans ce sens.", null] },
  { sentence: "___ David Mermet, son entraîneur, la championne a réussi avec brio ce pari fou de traverser l'Atlantique à la rame.", options: ["À cause de", "À travers", "En raison de", "Grâce à"], correct: 3,

  { sentence: "L'âge de la pierre taillée ___ de 2 millions à 10 000 ans avant J.-C.", options: ["dure", "s'écoule", "s'étend", "survit"], correct: 2,

  { sentence: "Notre émission vous propose de dresser le portrait ___ du nouveau chef du gouvernement.", options: ["automate", "machine", "mécanique", "robot"], correct: 3,

  { sentence: "Félix habite au 16e étage de la ___ située près du bureau de poste.", options: ["chambre", "cité", "maison", "tour"], correct: 3,

  { sentence: "J'ai demandé aux collègues quelle date conviendrait le mieux pour la réunion de service mais ___ que je propose, ils ne sont jamais satisfaits.", options: ["où", "quel", "qui", "quoi"], correct: 3,

  { sentence: "Ne t'inquiète pas, je te téléphonerai dès que l'avion ___.", options: ["atterrirait", "atterrisse", "aura atterri", "avait atterri"], correct: 2,

  { sentence: "On ne regardera pas la 6e chaîne ce soir ! Je déteste les émissions de télé-réalité ! ___ je veux bien voir le film documentaire sur la 2e.", options: ["En effet,", "En revanche,", "Néanmoins,", "Or,"], correct: 1,

  { sentence: "Si ma sœur ne ___ pas systématiquement à la légère, elle n'aurait pas tant de défis à relever.", options: ["s'engage", "s'engageait", "s'est engagée", "s'était engagée"], correct: 1,

const ACCENT = "#22c55e";
const BG_DARK = "#0f1a10";
const STORE_KEY = "tcf_progress_v1";

function saveProgress(data) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch(e){}
}
function loadProgress() {
  try { const r = localStorage.getItem(STORE_KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; }
}

const emptyStats = { lifetimeCorrect: 0, lifetimeAnswered: 0, sessions: 0, masteredIds: [], strugglingIds: [], bestPct: 0 };

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function App() {
  const ALL = QUESTIONS.map((q, i) => ({ ...q, id: i }));
  const [questions, setQuestions] = useState([]);
  const [current, setCurrent] = useState(0);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState(0);
  const [wrong, setWrong] = useState([]);
  const [phase, setPhase] = useState("home");
  const [mode, setMode] = useState("all");
  const [stats, setStats] = useState(emptyStats);
  const [hasSession, setHasSession] = useState(false);

  useEffect(() => {
    const saved = loadProgress();
    if (saved) {
      setStats(saved.stats || emptyStats);
      if (saved.session && saved.session.order && saved.session.current < saved.session.order.length) setHasSession(true);
    }
  }, []);

  const persist = (newStats, session) => saveProgress({ stats: newStats, session: session || null });

  const resumeSession = () => {
    const saved = loadProgress();
    if (saved && saved.session) {
      const s = saved.session;
      setQuestions(s.order.map(id => ALL[id]));
      setCurrent(s.current); setScore(s.score); setWrong(s.wrong || []);
      setMode(s.mode || "all"); setSelected(null); setPhase("quiz");
    }
  };

  const start = (m) => {
    setMode(m);
    const pool = m === "random20" ? shuffle(ALL).slice(0, 20) : shuffle(ALL);
    setQuestions(pool); setCurrent(0); setSelected(null); setScore(0); setWrong([]);
    setPhase("quiz"); setHasSession(true);
    saveProgress({ stats, session: { order: pool.map(q => q.id), current: 0, score: 0, wrong: [], mode: m } });
  };

  const q = questions[current];
  const total = questions.length;
  const progress = total > 0 ? (current / total) * 100 : 0;
  const isWrong = selected !== null && q && selected !== q.correct;

  function handleSelect(i) {
    if (selected !== null) return;
    setSelected(i);
    const correct = i === q.correct;
    const newScore = correct ? score + 1 : score;
    const newWrong = correct ? wrong : [...wrong, { ...q, chosen: i }];
    if (correct) setScore(newScore); else setWrong(newWrong);
    const mastered = new Set(stats.masteredIds);
    const struggling = new Set(stats.strugglingIds);
    if (correct) { mastered.add(q.id); struggling.delete(q.id); }
    else { struggling.add(q.id); mastered.delete(q.id); }
    const newStats = { ...stats, lifetimeCorrect: stats.lifetimeCorrect + (correct?1:0), lifetimeAnswered: stats.lifetimeAnswered + 1, masteredIds: [...mastered], strugglingIds: [...struggling] };
    setStats(newStats);
    persist(newStats, { order: questions.map(x => x.id), current, score: newScore, wrong: newWrong, mode });
  }

  function next() {
    if (current + 1 >= total) {
      const pct = Math.round((score / total) * 100);
      const finalStats = { ...stats, sessions: stats.sessions + 1, bestPct: Math.max(stats.bestPct, pct) };
      setStats(finalStats); persist(finalStats, null); setHasSession(false); setPhase("result");
    } else {
      const nc = current + 1; setCurrent(nc); setSelected(null);
      persist(stats, { order: questions.map(x => x.id), current: nc, score, wrong, mode });
    }
  }

  function renderSentence(sentence) {
    const parts = sentence.split("___");
    if (parts.length === 1) return <span>{sentence}</span>;
    return (<span>{parts[0]}<span style={{ display: "inline-block", borderBottom: `3px solid ${ACCENT}`, minWidth: 60, margin: "0 4px", color: selected !== null ? ACCENT : "transparent", fontWeight: 700 }}>{selected !== null ? q.options[q.correct] : "\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0"}</span>{parts[1]}</span>);
  }

  if (phase === "home") {
    const masteredCount = stats.masteredIds.length;
    const strugglingCount = stats.strugglingIds.length;
    const lifetimePct = stats.lifetimeAnswered > 0 ? Math.round((stats.lifetimeCorrect / stats.lifetimeAnswered) * 100) : 0;
    return (
      <div style={{ minHeight: "100vh", background: "#f3f4f6", padding: "max(20px, env(safe-area-inset-top)) 20px 20px" }}>
        <div style={{ maxWidth: 480, margin: "0 auto" }}>
          <div style={{ background: BG_DARK, borderRadius: 24, padding: 28, color: "#fff", marginBottom: 20, textAlign: "center" }}>
            <div style={{ fontSize: 11, color: ACCENT, letterSpacing: 3, textTransform: "uppercase", marginBottom: 6 }}>Préparation TCF · B2</div>
            <div style={{ fontSize: 26, fontWeight: 800, marginBottom: 4 }}>Structure de la Langue 🇫🇷</div>
            <div style={{ fontSize: 13, color: "#889" }}>{QUESTIONS.length} questions · TV5Monde</div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginBottom: 20 }}>
            {[{ label: "Réussite", value: lifetimePct + "%", sub: stats.lifetimeAnswered + " répondues" },{ label: "Maîtrisées", value: masteredCount, sub: "/ " + QUESTIONS.length },{ label: "À revoir", value: strugglingCount, sub: "questions" }].map((s, i) => (
              <div key={i} style={{ background: "#fff", borderRadius: 16, padding: "16px 10px", textAlign: "center" }}>
                <div style={{ fontSize: 24, fontWeight: 800, color: ACCENT }}>{s.value}</div>
                <div style={{ fontSize: 12, fontWeight: 700, color: "#374151", marginTop: 2 }}>{s.label}</div>
                <div style={{ fontSize: 10, color: "#9ca3af" }}>{s.sub}</div>
              </div>
            ))}
          </div>
          <div style={{ background: "#fff", borderRadius: 16, padding: 16, marginBottom: 20 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#6b7280", marginBottom: 8 }}><span>Progression globale</span><span>{Math.round((masteredCount / QUESTIONS.length) * 100)}%</span></div>
            <div style={{ height: 10, background: "#e5e7eb", borderRadius: 5, overflow: "hidden" }}><div style={{ height: "100%", width: `${(masteredCount / QUESTIONS.length) * 100}%`, background: ACCENT, borderRadius: 5, transition: "width 0.4s" }} /></div>
            {stats.sessions > 0 && (<div style={{ fontSize: 11, color: "#9ca3af", marginTop: 10 }}>{stats.sessions} session{stats.sessions > 1 ? "s" : ""} terminée{stats.sessions > 1 ? "s" : ""} · Meilleur score : {stats.bestPct}%</div>)}
          </div>
          {hasSession && (<button onClick={resumeSession} style={{ width: "100%", padding: 16, borderRadius: 14, border: "none", background: ACCENT, color: "#fff", fontSize: 16, cursor: "pointer", fontWeight: 700, marginBottom: 10 }}>▶ Reprendre où j'en étais</button>)}
          <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
            <button onClick={() => start("all")} style={{ flex: 1, padding: 14, borderRadius: 14, border: hasSession ? "2px solid " + ACCENT : "none", background: hasSession ? "transparent" : ACCENT, color: hasSession ? ACCENT : "#fff", fontSize: 14, cursor: "pointer", fontWeight: 700 }}>{hasSession ? "Nouveau (tout)" : "Commencer (" + QUESTIONS.length + ")"}</button>
            <button onClick={() => start("random20")} style={{ flex: 1, padding: 14, borderRadius: 14, border: "2px solid " + ACCENT, background: "transparent", color: ACCENT, fontSize: 14, cursor: "pointer", fontWeight: 700 }}>Aléatoire 20</button>
          </div>
          {strugglingCount > 0 && (<button onClick={() => { const pool = shuffle(ALL.filter(qq => stats.strugglingIds.includes(qq.id))); setMode("struggling"); setQuestions(pool); setCurrent(0); setSelected(null); setScore(0); setWrong([]); setPhase("quiz"); setHasSession(true); saveProgress({ stats, session: { order: pool.map(qq => qq.id), current: 0, score: 0, wrong: [], mode: "struggling" } }); }} style={{ width: "100%", padding: 14, borderRadius: 14, border: "2px solid #f59e0b", background: "#fffbeb", color: "#b45309", fontSize: 14, cursor: "pointer", fontWeight: 700, marginBottom: 10 }}>🎯 S'entraîner sur mes {strugglingCount} questions à revoir</button>)}
          {(stats.lifetimeAnswered > 0 || hasSession) && (<button onClick={() => { if(confirm("Réinitialiser toute ta progression ?")){ setStats(emptyStats); setHasSession(false); saveProgress({ stats: emptyStats, session: null }); } }} style={{ width: "100%", padding: 12, borderRadius: 14, border: "none", background: "transparent", color: "#9ca3af", fontSize: 13, cursor: "pointer", fontWeight: 600 }}>Réinitialiser ma progression</button>)}
        </div>
      </div>
    );
  }

  if (phase === "quiz" && q) {
    return (
      <div style={{ minHeight: "100vh", background: "#f3f4f6" }}>
        <div style={{ background: BG_DARK, padding: "max(16px, env(safe-area-inset-top)) 20px 0" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <button onClick={() => setPhase("home")} style={{ background: "none", border: "none", color: ACCENT, fontSize: 13, cursor: "pointer", padding: 0 }}>← Accueil</button>
            <div style={{ fontSize: 13, color: "#aaa" }}>{current + 1} / {total}</div>
          </div>
          <div style={{ height: 4, background: "#223322", borderRadius: 2 }}><div style={{ height: "100%", width: `${progress}%`, background: ACCENT, borderRadius: 2, transition: "width 0.3s" }} /></div>
          <div style={{ display: "flex", gap: 4, marginTop: 12 }}>
            {["all", "random20"].map(m => (<button key={m} onClick={() => start(m)} style={{ padding: "8px 16px", borderRadius: "10px 10px 0 0", border: "none", background: mode === m ? "#f3f4f6" : "transparent", color: mode === m ? "#222" : "#778", fontSize: 12, cursor: "pointer", fontWeight: mode === m ? 700 : 400 }}>{m === "all" ? "Tout (" + QUESTIONS.length + ")" : "Aléatoire 20"}</button>))}
          </div>
        </div>
        <div style={{ padding: "24px 16px", maxWidth: 620, margin: "0 auto" }}>
          <div style={{ background: BG_DARK, borderRadius: 20, padding: "28px 24px", marginBottom: 20, color: "#fff", minHeight: 100, display: "flex", flexDirection: "column", justifyContent: "center" }}>
            <div style={{ fontSize: 11, color: ACCENT, letterSpacing: 3, textTransform: "uppercase", marginBottom: 12 }}>Complétez la phrase</div>
            <div style={{ fontSize: 17, lineHeight: 1.8, fontStyle: "italic" }}>{renderSentence(q.sentence)}</div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {q.options.map((opt, i) => {
              let bg = "#fff", border = "2px solid #e5e7eb", color = "#333", icon = null;
              if (selected !== null) {
                if (i === q.correct) { bg = "#dcfce7"; border = `2px solid ${ACCENT}`; color = "#14532d"; icon = "✓"; }
                else if (i === selected) { bg = "#fee2e2"; border = "2px solid #ef4444"; color = "#7f1d1d"; icon = "✗"; }
              } else if (selected === i) { bg = "#f0fdf4"; border = `2px solid ${ACCENT}`; }
              return (<button key={i} onClick={() => handleSelect(i)} style={{ padding: "14px 18px", borderRadius: 14, border, background: bg, color, fontSize: 15, cursor: selected !== null ? "default" : "pointer", textAlign: "left", transition: "all 0.15s", display: "flex", alignItems: "center", gap: 10 }}><span style={{ width: 28, height: 28, borderRadius: 8, background: selected !== null && i === q.correct ? ACCENT : selected !== null && i === selected ? "#ef4444" : "#f3f4f6", color: selected !== null && (i === q.correct || i === selected) ? "#fff" : "#888", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, flexShrink: 0 }}>{icon || ["A","B","C","D"][i]}</span>{opt}</button>);
            })}
          </div>
          {selected !== null && (
            <div style={{ marginTop: 18, background: isWrong ? "#fff" : "#f0fdf4", borderRadius: 16, padding: 20, borderLeft: `4px solid ${isWrong ? "#ef4444" : ACCENT}` }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: isWrong ? "#ef4444" : ACCENT, marginBottom: 8, textTransform: "uppercase", letterSpacing: 1 }}>{isWrong ? "❌ Pas tout à fait — voici la règle" : "✅ Bravo ! La règle"}</div>
              <div style={{ fontSize: 14.5, lineHeight: 1.7, color: "#1f2937", marginBottom: isWrong ? 14 : 0 }}><strong>« {q.options[q.correct]} »</strong> — {q.rule}</div>
              {isWrong && (<div><div style={{ fontSize: 12, fontWeight: 700, color: "#6b7280", marginBottom: 8, textTransform: "uppercase", letterSpacing: 1 }}>Pourquoi les autres sont fausses :</div><div style={{ display: "flex", flexDirection: "column", gap: 8 }}>{q.options.map((opt, i) => { if (i === q.correct || !q.why[i]) return null; return (<div key={i} style={{ fontSize: 13.5, lineHeight: 1.6, color: "#4b5563", display: "flex", gap: 8 }}><span style={{ color: "#ef4444", fontWeight: 700, flexShrink: 0 }}>✗ {opt} :</span><span>{q.why[i]}</span></div>); })}</div></div>)}
            </div>
          )}
          {selected !== null && (<button onClick={next} style={{ width: "100%", marginTop: 18, padding: 16, borderRadius: 14, border: "none", background: ACCENT, color: "#fff", fontSize: 16, cursor: "pointer", fontWeight: 700 }}>{current + 1 >= total ? "Voir les résultats →" : "Question suivante →"}</button>)}
          <div style={{ display: "flex", justifyContent: "center", gap: 24, marginTop: 18, color: "#888", fontSize: 13 }}><span>✅ {score}</span><span>❌ {wrong.length}</span></div>
        </div>
      </div>
    );
  }

  if (phase === "result") {
    const pct = Math.round((score / total) * 100);
    const emoji = pct >= 80 ? "🏆" : pct >= 60 ? "👍" : "💪";
    const msg = pct >= 80 ? "Excellent ! Niveau B2 bien engagé !" : pct >= 60 ? "Bon travail, continuez !" : "Continuez à pratiquer !";
    return (
      <div style={{ minHeight: "100vh", background: "#f3f4f6", padding: "max(20px, env(safe-area-inset-top)) 20px 20px" }}>
        <div style={{ maxWidth: 480, margin: "0 auto" }}>
          <div style={{ background: BG_DARK, borderRadius: 24, padding: 32, textAlign: "center", color: "#fff", marginBottom: 20 }}>
            <div style={{ fontSize: 52, marginBottom: 8 }}>{emoji}</div>
            <div style={{ fontSize: 40, fontWeight: 800, color: ACCENT }}>{score}/{total}</div>
            <div style={{ fontSize: 22, fontWeight: 700, marginBottom: 8 }}>{pct}%</div>
            <div style={{ color: "#aaa", fontSize: 14 }}>{msg}</div>
            <div style={{ height: 8, background: "#1a2f1a", borderRadius: 4, marginTop: 20, overflow: "hidden" }}><div style={{ height: "100%", width: `${pct}%`, background: ACCENT, borderRadius: 4 }} /></div>
          </div>
          <div style={{ display: "flex", gap: 10, marginBottom: 12 }}>
            <button onClick={() => start("all")} style={{ flex: 1, padding: 14, borderRadius: 14, border: "none", background: ACCENT, color: "#fff", fontSize: 14, cursor: "pointer", fontWeight: 700 }}>Recommencer tout</button>
            <button onClick={() => start("random20")} style={{ flex: 1, padding: 14, borderRadius: 14, border: "2px solid " + ACCENT, background: "transparent", color: ACCENT, fontSize: 14, cursor: "pointer", fontWeight: 700 }}>20 questions</button>
          </div>
          <button onClick={() => setPhase("home")} style={{ width: "100%", padding: 13, borderRadius: 14, border: "none", background: "#e5e7eb", color: "#374151", fontSize: 14, cursor: "pointer", fontWeight: 700, marginBottom: 20 }}>🏠 Accueil & statistiques</button>
          {wrong.length > 0 && (<button onClick={() => setPhase("review")} style={{ width: "100%", padding: 14, borderRadius: 14, border: "2px solid #ef4444", background: "#fee2e2", color: "#7f1d1d", fontSize: 14, cursor: "pointer", fontWeight: 700 }}>Revoir mes {wrong.length} erreur{wrong.length > 1 ? "s" : ""} avec explications →</button>)}
        </div>
      </div>
    );
  }

  if (phase === "review") {
    return (
      <div style={{ minHeight: "100vh", background: "#f3f4f6", padding: "max(20px, env(safe-area-inset-top)) 20px 20px" }}>
        <div style={{ maxWidth: 560, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}><button onClick={() => setPhase("result")} style={{ background: "none", border: "none", fontSize: 20, cursor: "pointer" }}>←</button><div style={{ fontSize: 16, fontWeight: 700 }}>Mes erreurs ({wrong.length})</div></div>
          {wrong.map((w, idx) => (<div key={idx} style={{ background: "#fff", borderRadius: 16, padding: 20, marginBottom: 14, borderLeft: "4px solid #ef4444" }}><div style={{ fontSize: 14, lineHeight: 1.7, marginBottom: 12, color: "#333", fontStyle: "italic" }}>{w.sentence.replace("___", "[" + w.options[w.correct] + "]")}</div><div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 12 }}><span style={{ fontSize: 12, background: "#fee2e2", color: "#7f1d1d", borderRadius: 8, padding: "4px 10px" }}>✗ {w.options[w.chosen]}</span><span style={{ fontSize: 12, background: "#dcfce7", color: "#14532d", borderRadius: 8, padding: "4px 10px" }}>✓ {w.options[w.correct]}</span></div><div style={{ fontSize: 13.5, lineHeight: 1.65, color: "#374151", background: "#f9fafb", borderRadius: 10, padding: 12 }}>{w.rule}</div></div>))}
          <button onClick={() => start("all")} style={{ width: "100%", marginTop: 10, padding: 14, borderRadius: 14, border: "none", background: ACCENT, color: "#fff", fontSize: 15, cursor: "pointer", fontWeight: 700 }}>Recommencer →</button>
        </div>
      </div>
    );
  }
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
